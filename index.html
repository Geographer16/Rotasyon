<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Rotasyon — Gelişmiş Rota Optimizasyonu &amp; Gezi Planlama</title>
<meta name="theme-color" content="#080b10">

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<!-- FontAwesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<!-- SweetAlert2 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
<!-- Google Fonts: Space Grotesk (başlık/veri), Inter (gövde) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Tailwind CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink: '#080b10',
          panel: '#0d1218',
          glass: 'rgba(16, 22, 30, 0.62)',
          border: 'rgba(148, 176, 199, 0.14)',
          accent: '#3ddc97',
          accent2: '#5b8def',
          warn: '#f2a341',
          danger: '#ef5a6f',
        },
        fontFamily: {
          display: ['"Space Grotesk"', 'sans-serif'],
          body: ['Inter', 'sans-serif'],
        },
      },
    },
  };
</script>

<style>
/* =========================================================
   Rotasyon — Gelişmiş Rota Optimizasyon Uygulaması
   Stil Dosyası
   ========================================================= */

:root {
  --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
}

* { box-sizing: border-box; }

html, body {
  background: #060809;
  scrollbar-gutter: stable;
  height: 100%;
  overscroll-behavior: none;
}

/* Mobil tarayıcılarda adres çubuğunun açılıp kapanmasıyla 100vh zıplamasını
   önlemek için, destekleyen tarayıcılarda dinamik viewport birimini kullan. */
@supports (height: 100dvh) {
  html, body, #app {
    height: 100dvh;
  }
}

/* Zemin dokusu: hafif noktalı grid + vinyet */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 15% 10%, rgba(61, 220, 151, 0.05), transparent 45%),
    radial-gradient(ellipse at 85% 90%, rgba(91, 141, 239, 0.06), transparent 50%);
}

/* ================= LEAFLET TWEAKS ================= */
#map {
  background: #0a0e13;
  filter: saturate(1.02);
}

/* ================= KARANLIK TEMA TILE FİLTRESİ =================
   CARTO'nun ücretsiz "dark_all" tile servisi API key zorunlu hale geldiği için,
   karanlık harita teması standart (anahtarsız) OpenStreetMap tile'ları üzerine
   CSS invert/hue-rotate filtresi uygulanarak elde ediliyor. Bu sayede hiçbir
   API key, hesap veya alan adı onayı gerekmiyor; tamamen istemci taraflı bir çözüm. */
.tile-layer-dark {
  filter: invert(1) hue-rotate(180deg) brightness(0.94) contrast(0.92) saturate(0.85);
}
.tile-layer-dark img {
  image-rendering: -webkit-optimize-contrast;
}

.leaflet-control-attribution {
  background: rgba(8, 11, 16, 0.7) !important;
  color: #64748b !important;
  font-size: 10px !important;
  backdrop-filter: blur(6px);
}
.leaflet-control-attribution a { color: #94a3b8 !important; }
.leaflet-popup-content-wrapper {
  background: #0f151c;
  color: #e2e8f0;
  border-radius: 14px;
  border: 1px solid rgba(148, 176, 199, 0.16);
  box-shadow: 0 10px 40px rgba(0,0,0,0.5);
}
.leaflet-popup-tip { background: #0f151c; }
.leaflet-popup-content { margin: 12px 14px; font-family: 'Inter', sans-serif; font-size: 13px; }
.leaflet-popup-close-button { color: #64748b !important; }

/* Durak pin'ine tıklayınca açılan mini pencere: isim zaten pinin yanında
   sürekli görünen etikette yazdığı için burada tekrar edilmiyor, sadece
   "Durağı Sil" aksiyonu gösteriliyor. Leaflet'in varsayılan kapatma çarpısı
   (closeButton:false) kapatıldı ki silme çarpısıyla üst üste binmesin. */
.stop-delete-popup .leaflet-popup-content-wrapper { padding: 4px; border-radius: 12px; }
.stop-delete-popup .leaflet-popup-content { margin: 0; }
.stop-popup-remove-only {
  display: flex;
  align-items: center;
  gap: 7px;
  width: 100%;
  padding: 9px 14px;
  border-radius: 9px;
  background: rgba(239, 90, 111, 0.14);
  border: 1px solid rgba(239, 90, 111, 0.35);
  color: #ef5a6f;
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  cursor: pointer;
  transition: background 0.15s ease, transform 0.15s ease;
}
.stop-popup-remove-only:hover { background: rgba(239, 90, 111, 0.26); }
.stop-popup-remove-only:active { transform: scale(0.96); }

/* Pin'in yanında sürekli görünen isim etiketi (il/ilçe/mahalle vb.) */
.pin-label-tooltip {
  background: rgba(13, 18, 24, 0.88);
  backdrop-filter: blur(6px);
  color: #f1f5f9;
  border: 1px solid rgba(148, 176, 199, 0.2);
  border-radius: 8px;
  padding: 5px 11px;
  font-family: 'Inter', sans-serif;
  font-size: 13.5px;
  font-weight: 700;
  box-shadow: 0 4px 14px rgba(0,0,0,0.35);
  white-space: nowrap;
}
.pin-label-tooltip::before { display: none; }

/* ================= GLASSMORPHIC SHELL ================= */
.glass-card {
  background: rgba(13, 18, 24, 0.62);
  backdrop-filter: blur(20px) saturate(1.4);
  -webkit-backdrop-filter: blur(20px) saturate(1.4);
  border: 1px solid rgba(148, 176, 199, 0.14);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255,255,255,0.03);
  transition: background 0.2s ease, border-color 0.2s ease;
}

/* Açık zeminli harita temaları (Standart / Topoğrafik) aktifken, arkadan sızan
   açık renkli tile'lar glassmorphic panellerin kontrastını düşürüyordu.
   body üzerindeki .map-theme-light sınıfı ile panel/menü arkaplanını
   belirgin biçimde daha opak ve koyu yaparak yazıların her zaman okunur
   kalmasını sağlıyoruz. */
body.map-theme-light .glass-card {
  background: rgba(9, 13, 18, 0.92);
  border-color: rgba(148, 176, 199, 0.22);
}

.glass-inset {
  background: rgba(255, 255, 255, 0.025);
  border: 1px solid rgba(148, 176, 199, 0.1);
}

/* ---- Panel shell: masaüstü sabit sol panel / mobil off-canvas ---- */
.panel-shell {
  position: absolute;
  z-index: 700;
  display: flex;
  flex-direction: column;
  border-radius: 0;
}

@media (min-width: 1024px) {
  .panel-shell {
    top: 16px;
    left: 16px;
    bottom: 16px;
    width: 400px;
    border-radius: 22px;
  }

  /* Masaüstünde sol panel #zoom-fab'ı tamamen kapattığı için, yakınlaştır/
     uzaklaştır butonlarını sağ alta, #map-fab'ın (konum/GPX/paylaş) hemen
     üstüne taşıyoruz; böylece hem görünür olur hem de panelle çakışmaz. */
  #zoom-fab {
    left: auto;
    right: 16px;
    bottom: 208px;
  }
}

/* Mobil: alttan yukarı kayan drawer */
@media (max-width: 1023px) {
  .panel-shell {
    left: 0;
    right: 0;
    bottom: 0;
    top: auto;
    height: 78vh;
    max-height: 78vh;
    border-radius: 24px 24px 0 0;
    transform: translateY(100%);
    transition: transform 0.42s var(--ease-out-expo);
    /* Alt çentikli (home indicator) telefonlarda panel içeriğinin ve alt
       butonun cihaz kenarına yapışmaması için güvenli alan payı */
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .panel-shell.open { transform: translateY(0); }
  #drawer-handle { transition: opacity 0.25s ease, transform 0.25s ease; }
  #drawer-handle.hidden-handle { opacity: 0; transform: translate(-50%, 40px); pointer-events: none; }

  /* Dikey (portrait) mobil: harita üstü kontrolleri drawer tutamacı ve
     çentik/durum çubuğu ile çakışmayacak şekilde konumlandır */
  #layer-switcher {
    top: calc(env(safe-area-inset-top, 0px) + 12px);
    right: 12px;
  }
  #map-fab, #zoom-fab {
    bottom: calc(env(safe-area-inset-bottom, 0px) + 88px);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  #map-fab { right: 12px; }
  #zoom-fab { left: 12px; }
  #drawer-handle {
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
  }

  /* Drawer açıkken harita üstü FAB'lar (zoom/GPX/paylaş) drawer'ın hemen
     üst kenarına çok yakın kalıp yanlışlıkla dokunulabiliyordu; body'ye
     eklenen .drawer-open class'ı ile drawer açıkken bunlar gizlenir. */
  body.drawer-open #map-fab,
  body.drawer-open #zoom-fab {
    opacity: 0;
    transform: translateY(12px);
    pointer-events: none;
  }

  /* Panel başlığı, aşağı kaydırarak paneli kapatmak için bir sürükleme
     tutamacı gibi davranır; dikey dokunma hareketini tarayıcının kendi
     scroll/refresh davranışına bırakmadan JS ile yönetiyoruz. */
  #panel-drag-handle {
    touch-action: none;
    cursor: grab;
  }
}

/* Kısa/yatay mobil ekranlarda (yükseklik dar) drawer'ın çok yer kaplamasını önle */
@media (max-width: 1023px) and (max-height: 480px) {
  .panel-shell { height: 88vh; max-height: 88vh; }
  #map-fab, #zoom-fab { bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); }
}

@media (min-width: 1024px) {
  #drawer-close { display: none; }
}

/* ================= SCROLLBAR ================= */
.scrollbar-thin::-webkit-scrollbar { width: 6px; }
.scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
.scrollbar-thin::-webkit-scrollbar-thumb { background: rgba(148,176,199,0.2); border-radius: 10px; }
.scrollbar-thin::-webkit-scrollbar-thumb:hover { background: rgba(148,176,199,0.35); }
/* Drawer içeriği kaydırılırken, kaydırma listenin sonuna geldiğinde
   arkadaki sayfaya/haritaya "overscroll" olarak sızmasın (mobilde
   pull-to-refresh veya harita zoom'unun kazara tetiklenmesini önler). */
.scrollbar-thin { overscroll-behavior: contain; }

/* ================= FORM ELEMENTS ================= */
.field-label {
  display: block;
  font-size: 11.5px;
  font-weight: 600;
  color: #8a9bb0;
  margin-bottom: 6px;
  letter-spacing: 0.01em;
}

.input-field {
  width: 100%;
  background: rgba(255,255,255,0.035);
  border: 1px solid rgba(148,176,199,0.16);
  border-radius: 12px;
  padding: 11px 12px;
  font-size: 13.5px;
  color: #f1f5f9;
  transition: border-color 0.15s ease, background 0.15s ease;
}
.input-field::placeholder { color: #55647a; }
.input-field:focus {
  outline: none;
  border-color: rgba(61, 220, 151, 0.5);
  background: rgba(255,255,255,0.05);
}

.input-field-sm {
  width: 100%;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(148,176,199,0.16);
  border-radius: 9px;
  padding: 7px 9px;
  font-size: 13px;
  color: #f1f5f9;
}
.input-field-sm:focus { outline: none; border-color: rgba(61,220,151,0.5); }

.field-icon {
  position: absolute;
  left: 13px;
  top: 50%;
  transform: translateY(-50%);
  color: #55647a;
  font-size: 13px;
  pointer-events: none;
}

/* ================= BUTTONS ================= */
.btn-primary {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  background: linear-gradient(135deg, #3ddc97, #2fb883);
  color: #06120c;
  font-weight: 600;
  border-radius: 13px;
  padding: 10px 14px;
  transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
  box-shadow: 0 4px 18px rgba(61, 220, 151, 0.22);
}
.btn-primary:hover { filter: brightness(1.07); transform: translateY(-1px); }
.btn-primary:active { transform: translateY(0); }
.btn-primary:disabled { opacity: 0.45; filter: none; transform: none; cursor: not-allowed; }

.btn-secondary {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(148,176,199,0.16);
  color: #cbd5e1;
  font-weight: 500;
  border-radius: 11px;
  padding: 9px 10px;
  transition: background 0.15s ease, border-color 0.15s ease;
}
.btn-secondary:hover { background: rgba(255,255,255,0.075); border-color: rgba(148,176,199,0.28); }

.fab-btn {
  width: 46px; height: 46px;
  border-radius: 15px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(13, 18, 24, 0.72);
  backdrop-filter: blur(16px);
  border: 1px solid rgba(148,176,199,0.16);
  color: #e2e8f0;
  font-size: 16px;
  box-shadow: 0 6px 24px rgba(0,0,0,0.35);
  transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease;
}
.fab-btn:hover { transform: translateY(-2px); color: #3ddc97; background: rgba(13,18,24,0.9); }
.fab-btn:active { transform: translateY(0); }

/* ================= ZOOM FAB ================= */
.zoom-btn {
  width: 44px; height: 44px;
  display: flex; align-items: center; justify-content: center;
  color: #e2e8f0;
  font-size: 15px;
  border-radius: 13px;
  transition: background 0.15s ease, color 0.15s ease;
}
.zoom-btn:hover { color: #3ddc97; background: rgba(255,255,255,0.06); }
.zoom-btn:active { transform: scale(0.94); }
.zoom-btn-divider { height: 1px; margin: 0 6px; background: rgba(148,176,199,0.16); }

.layer-btn {
  width: 38px; height: 38px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  color: #8a9bb0;
  font-size: 14px;
  transition: background 0.15s ease, color 0.15s ease;
}
.layer-btn:hover { color: #e2e8f0; background: rgba(255,255,255,0.06); }
.layer-btn.active { color: #06120c; background: #3ddc97; }
/* Açık harita temalarında pasif katman ikonlarının kontrastını artır */
body.map-theme-light .layer-btn:not(.active) { color: #cbd5e1; }

/* ================= SUGGESTION BOX ================= */
.suggestion-box {
  position: absolute;
  top: calc(100% + 6px);
  left: 0; right: 0;
  z-index: 900;
  background: #0e141b;
  border: 1px solid rgba(148,176,199,0.18);
  border-radius: 14px;
  box-shadow: 0 16px 44px rgba(0,0,0,0.5);
  max-height: 280px;
  overflow-y: auto;
  padding: 6px;
}
.suggestion-item {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 9px 10px;
  border-radius: 10px;
  cursor: pointer;
  transition: background 0.12s ease;
}
.suggestion-item:hover, .suggestion-item.kbd-active { background: rgba(61, 220, 151, 0.09); }
.suggestion-item i { color: #5b8def; margin-top: 2px; font-size: 12px; }
.suggestion-item .s-title { font-size: 13px; color: #e2e8f0; font-weight: 500; line-height: 1.35; }
.suggestion-item .s-sub { font-size: 11px; color: #64748b; margin-top: 1px; }
.suggestion-loading, .suggestion-empty {
  padding: 14px 10px; text-align: center; font-size: 12.5px; color: #64748b;
}

/* ================= STOP LIST CARDS ================= */
.stop-card {
  display: flex; align-items: center; gap: 10px;
  background: rgba(255,255,255,0.035);
  border: 1px solid rgba(148,176,199,0.13);
  border-radius: 13px;
  padding: 9px 10px;
  cursor: grab;
  transition: background 0.15s ease, border-color 0.15s ease;
}
.stop-card:active { cursor: grabbing; }
.stop-card.sortable-ghost { opacity: 0.35; }
.stop-card.sortable-chosen { border-color: rgba(61,220,151,0.4); background: rgba(61,220,151,0.06); }
.stop-card .drag-handle {
  color: #475569; font-size: 14px;
  padding: 11px 8px; margin: -11px 0;
  touch-action: none;
}
.stop-card .stop-marker {
  width: 26px; height: 26px; border-radius: 8px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 11px; color: #06120c; font-weight: 700;
}
.stop-card .stop-info { flex: 1; min-width: 0; }
.stop-card .stop-title { font-size: 12.5px; color: #e2e8f0; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stop-card .stop-sub { font-size: 10.5px; color: #64748b; }
.stop-card .stop-remove {
  color: #475569; width: 38px; height: 38px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  margin: -6px -6px -6px 0;
  transition: color 0.12s ease, background 0.12s ease;
}
.stop-card .stop-remove:hover { color: #ef5a6f; background: rgba(239,90,111,0.1); }

/* ================= STAT CHIPS / METRICS ================= */
.stat-chip {
  display: flex; align-items: center; gap: 9px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(148,176,199,0.12);
  border-radius: 13px;
  padding: 10px 11px;
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  font-size: 15px;
  color: #f1f5f9;
}
.stat-chip i { font-size: 15px; }
.stat-chip-label { font-family: 'Inter', sans-serif; font-weight: 500; font-size: 10px; color: #64748b; margin-top: 1px; }

.leg-row {
  display: flex; align-items: center; justify-content: space-between;
  background: rgba(255,255,255,0.02);
  border: 1px solid rgba(148,176,199,0.08);
  border-radius: 10px;
  padding: 7px 10px;
  font-size: 11.5px;
}
.leg-row .leg-label { color: #94a3b8; display: flex; align-items: center; gap: 6px; }
.leg-row .leg-num { color: #cbd5e1; font-weight: 600; font-family: 'Space Grotesk', sans-serif; }

.elev-metric {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  background: rgba(255,255,255,0.025);
  border-radius: 10px;
  padding: 9px 4px;
  text-align: center;
}
.elev-metric span { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 13.5px; color: #f1f5f9; }
.elev-metric label { font-size: 9.5px; color: #64748b; }

/* ================= RANGE SLIDER ================= */
.range-slider {
  -webkit-appearance: none;
  width: 100%;
  height: 5px;
  border-radius: 4px;
  background: linear-gradient(90deg, #3ddc97, #2b3542);
  outline: none;
}
.range-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 17px; height: 17px;
  border-radius: 50%;
  background: #3ddc97;
  border: 3px solid #0d1218;
  box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  cursor: pointer;
}
.range-slider::-moz-range-thumb {
  width: 17px; height: 17px; border-radius: 50%;
  background: #3ddc97; border: 3px solid #0d1218; cursor: pointer;
}

/* ================= POI TOGGLE ================= */
.poi-toggle {
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(148,176,199,0.14);
  border-radius: 12px;
  padding: 10px 4px;
  font-size: 10.5px;
  color: #94a3b8;
  transition: border-color 0.15s ease, background 0.15s ease;
}
.poi-toggle i { font-size: 16px; }
.poi-toggle[data-active="true"] {
  border-color: rgba(61,220,151,0.5);
  background: rgba(61,220,151,0.08);
  color: #e2e8f0;
}

/* ================= FUEL TYPE TOGGLE ================= */
.fuel-type-btn {
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(148,176,199,0.14);
  border-radius: 12px;
  padding: 10px 4px;
  font-size: 10.5px;
  color: #94a3b8;
  transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
}
.fuel-type-btn i { font-size: 16px; }
.fuel-type-btn.active {
  border-color: rgba(61,220,151,0.5);
  background: rgba(61,220,151,0.08);
  color: #e2e8f0;
}

/* ================= SKELETON LOADER ================= */
.skeleton-chart {
  height: 140px;
  border-radius: 10px;
  background: linear-gradient(100deg, rgba(255,255,255,0.03) 30%, rgba(255,255,255,0.07) 50%, rgba(255,255,255,0.03) 70%);
  background-size: 200% 100%;
  animation: shimmer 1.4s infinite;
}
.skeleton-line {
  height: 44px;
  border-radius: 13px;
  background: linear-gradient(100deg, rgba(255,255,255,0.03) 30%, rgba(255,255,255,0.07) 50%, rgba(255,255,255,0.03) 70%);
  background-size: 200% 100%;
  animation: shimmer 1.4s infinite;
}
@keyframes shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* ================= CUSTOM LEAFLET MARKER ICONS ================= */
.map-pin {
  width: 30px; height: 30px;
  border-radius: 50% 50% 50% 0;
  transform: rotate(-45deg) scale(var(--zoom-pin-scale, 1));
  transform-origin: bottom center;
  transition: transform 0.15s ease;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 3px 10px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.25);
  border: 2px solid rgba(255,255,255,0.85);
}
.map-pin i { transform: rotate(45deg); font-size: 13px; color: #06120c; }
.map-pin.pin-start { background: #3ddc97; }
.map-pin.pin-end { background: #ef5a6f; }
.map-pin.pin-stop { background: #5b8def; }
.map-pin.pin-fuel { background: #f2a341; }
.map-pin.pin-hotel { background: #a875f0; }
.map-pin.pin-restaurant { background: #f2d541; }

.elev-cursor-dot {
  width: 14px; height: 14px; border-radius: 50%;
  background: #3ddc97;
  border: 3px solid #0a120e;
  box-shadow: 0 0 0 3px rgba(61,220,151,0.35), 0 2px 10px rgba(0,0,0,0.5);
}

/* Harita FAB'ı ile bulunan kullanıcı konumu için nabız gösterge */
.user-location-dot {
  width: 16px; height: 16px; border-radius: 50%;
  background: #5b8def;
  border: 3px solid #ffffff;
  box-shadow: 0 0 0 4px rgba(91,141,239,0.3), 0 2px 10px rgba(0,0,0,0.5);
  position: relative;
}
.user-location-dot::after {
  content: "";
  position: absolute;
  inset: -8px;
  border-radius: 50%;
  background: rgba(91,141,239,0.25);
  animation: user-location-pulse 1.8s ease-out infinite;
}
@keyframes user-location-pulse {
  0% { transform: scale(0.5); opacity: 0.9; }
  100% { transform: scale(1.8); opacity: 0; }
}

/* Haritada, çoklu duraklı rotalarda her bacağın (leg) orta noktasına konan
   mesafe/süre etiketi. Rota çizgisiyle karışmasın diye biraz yukarıda durur
   ve altına, ait olduğu noktayı işaret eden küçük bir konektör çizgisi ve
   nokta eklenir. */
.leg-map-label-wrap {
  transform: translate(-50%, -100%) scale(var(--zoom-label-scale, 1));
  transform-origin: bottom center;
  transition: transform 0.15s ease, opacity 0.15s ease;
  display: flex;
  flex-direction: column;
  align-items: center;
  pointer-events: none;
}
.leg-map-label {
  background: rgba(6, 9, 13, 0.96);
  border: 1px solid rgba(61, 220, 151, 0.55);
  border-radius: 999px;
  padding: 6px 13px;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 13.5px;
  font-weight: 700;
  color: #f1f5f9;
  white-space: nowrap;
  box-shadow: 0 3px 12px rgba(0,0,0,0.55);
}
.leg-map-label-connector {
  width: 1px;
  height: 12px;
  background: rgba(61, 220, 151, 0.6);
}
.leg-map-label-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #3ddc97;
  margin-top: -2.5px;
  box-shadow: 0 0 0 2px rgba(6,9,13,0.9);
}

/* Uzaklaşınca (düşük zoom) bacak etiketleri ekranda birbirine çok yaklaşıp
   üst üste bindiği ve okunmaz hale geldiği için, belirli bir eşiğin altında
   tamamen gizlenir; yakınlaşınca (map-zoom-far kalkınca) tekrar belirir. */
#map.map-zoom-far .leg-map-label-wrap {
  opacity: 0;
  pointer-events: none;
}

/* Pin yanındaki isim etiketi de aynı şekilde zoom'a göre ölçeklenir; çok
   uzaklaşıldığında haritanın kalabalıklaşmaması için gizlenir.
   NOT: Leaflet, tooltip'in konumunu .pin-label-tooltip elementinin kendi
   transform'u (translate3d) ile ayarlıyor; ölçeklendirmeyi bunun üzerine
   yazmamak için iç bir <span> sarmalayıcıya (.pin-label-inner) uyguluyoruz. */
.pin-label-inner {
  display: inline-block;
  transform: scale(var(--zoom-label-scale, 1));
  transform-origin: left center;
  transition: transform 0.15s ease;
}
#map.map-zoom-far .pin-label-tooltip {
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.15s ease;
}

/* ============================================================
   1b. İSTEK KUYRUĞU / RATE LIMITER
   Nominatim politikası ~1 istek/sn'yi önerir; Overpass da art arda
   hızlı isteklerde 429 dönebilir. Bu basit kuyruk, aynı servise giden
   istekleri sıraya koyup aralarında minimum bir bekleme süresi bırakır.
   ============================================================ */
class RateLimitedQueue {
  constructor(minIntervalMs) {
    this.minInterval = minIntervalMs;
    this.lastCallAt = 0;
    this.queue = Promise.resolve();
  }

  /** fn: () => Promise — sıraya girer, önceki çağrıdan minInterval kadar sonra çalışır */
  enqueue(fn) {
    const run = () => {
      const now = Date.now();
      const wait = Math.max(0, this.minInterval - (now - this.lastCallAt));
      return new Promise((resolve) => setTimeout(resolve, wait)).then(() => {
        this.lastCallAt = Date.now();
        return fn();
      });
    };
    const result = this.queue.then(run, run);
    // Zincirin bir hata yüzünden kilitlenmemesi için sonucu yutan ayrı bir kuyruk ilerletici
    this.queue = result.catch(() => {});
    return result;
  }
}

/** Metre cinsinden mesafeyi aktif birim sistemine göre formatlar (sayı döner) */
function formatDistance(meters) {
  if (state.unitSystem === 'imperial') {
    const miles = meters / 1609.344;
    return miles < 10 ? miles.toFixed(2) : miles.toFixed(1);
  }
  const km = meters / 1000;
  return km < 10 ? km.toFixed(2) : km.toFixed(1);
}

function distanceUnitLabel() {
  return state.unitSystem === 'imperial' ? 'mil' : 'km';
}

function formatDurationMin(seconds) {
  const totalMin = Math.round(seconds / 60);
  if (totalMin < 60) return `${totalMin} dk`;
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  return m > 0 ? `${h} sa ${m} dk` : `${h} sa`;
}

/** Metreyi aktif birime göre rakım/yükseklik formatlar */
function formatElevation(meters) {
  if (state.unitSystem === 'imperial') {
    return `${Math.round(meters * 3.28084)} ft`;
  }
  return `${Math.round(meters)} m`;
}

/** Litre → galon (US) dönüşümü gerektiğinde kullanılacak */
function litersToGallons(liters) {
  return liters / 3.78541;
}

function haversineMeters(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const toRad = (d) => (d * Math.PI) / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

/** fetch için zaman aşımı sarmalayıcı */
async function fetchWithTimeout(url, options = {}, timeoutMs = 12000) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try {
    const res = await fetch(url, { ...options, signal: controller.signal });
    clearTimeout(timer);
    return res;
  } catch (err) {
    clearTimeout(timer);
    throw err;
  }
}

/**
 * Pin ve etiketlerin harita zoom seviyesine göre optimum boyuta uyarlanmasını
 * sağlar. Leaflet marker/tooltip'leri ekran pikseli cinsinde sabit boyutta
 * çizildiği için, uzaklaşınca haritada olduklarından büyük/kalabalık,
 * yakınlaşınca da orantısız küçük kalabiliyorlardı. Burada zoom seviyesine
 * göre bir ölçek katsayısı (CSS değişkeni) hesaplanıp harita köküne
 * uygulanıyor; ayrıca çok düşük zoom'da (uzaklaşınca) bacak mesafe etiketleri
 * ve pin isim etiketleri üst üste binip okunmaz hale gelmesin diye tamamen
 * gizleniyor.
 */
function updateZoomAdaptiveStyles() {
  if (!map) return;
  const zoom = map.getZoom();
  const mapEl = document.getElementById('map');

  // Referans zoom 13: bu seviyede ölçek 1'dir. Etiketler zaten temelde
  // okunaklı bir boyutta tasarlandığı için, zoom'a göre çok agresif
  // küçültme/büyütme yapmıyoruz; sadece hafif bir uyum sağlıyoruz.
  const rawScale = 1 + (zoom - 13) * 0.04;
  const clampedScale = Math.min(1.15, Math.max(0.9, rawScale));

  mapEl.style.setProperty('--zoom-pin-scale', clampedScale.toFixed(3));
  mapEl.style.setProperty('--zoom-label-scale', clampedScale.toFixed(3));

  // Çok uzaklaşıldığında (zoom <= 6, örn. ülke/kıta ölçeği) mesafe/isim
  // etiketleri ekranda çok yakın düşüp üst üste bindiği için gizlenir;
  // pinler görünmeye devam eder. Eşik düşük tutuldu ki normal "birkaç
  // şehir arası rota" görünümlerinde etiketler her zaman görünsün.
  mapEl.classList.toggle('map-zoom-far', zoom <= 6);
}

function switchBaseLayer(key, btnEl) {
  if (key === state.currentBaseLayer) return;
  map.removeLayer(baseLayers[state.currentBaseLayer]);
  baseLayers[key].addTo(map);
  state.currentBaseLayer = key;
  document.querySelectorAll('.layer-btn').forEach((b) => b.classList.remove('active'));
  btnEl.classList.add('active');
  // Standart (osm) ve Topoğrafik (topo) katmanlar açık renkli zemine sahip;
  // panel/menü kontrastını korumak için body'ye tema sınıfı ekleyip çıkarıyoruz.
  document.body.classList.toggle('map-theme-light', key !== 'dark');
}

/**
 * Arama zinciri: önce anahtarsız servisleri (Photon, sonra Nominatim) dener.
 * İkisi de CORS veya ağ hatasıyla başarısız olursa, kullanıcı daha önce bir
 * LocationIQ key girmişse onunla dener; girmemişse arama kutusunda isteğe
 * bağlı bir "API key gir" formu gösterir. Hiçbir aşama kod hatası değildir —
 * dış servislerin CORS politikasına bağlı bir durumdur.
 */
async function runAddressSearch(query) {
  if (searchAbortController) searchAbortController.abort();
  searchAbortController = new AbortController();
  const localController = searchAbortController;

  // 1) Photon dene — ancak devre kesici açıksa (art arda başarısız oldu, cooldown'da) atla
  const photonAvailable = Date.now() >= photonDisabledUntil;
  if (photonAvailable) {
    try {
      const features = await photonQueue.enqueue(async () => {
        // lat/lon/zoom: Photon'un "location bias" parametreleri. Türkiye'nin coğrafi
        // merkezine yakın bir koordinat + düşük zoom (=geniş bias) vererek, aynı isimli
        // yerlerde (ör. "Trabzon" yazarken yurt dışındaki benzer adlı yerler yerine)
        // Türkiye'deki sonuçların öne çıkması sağlanır. Bu bir KATI filtre değildir —
        // kullanıcı yurt dışında bir yer ararsa yine sonuç dönebilir, sadece sıralama etkilenir.
        const url = `${ENDPOINTS.photon}?q=${encodeURIComponent(query)}&limit=6&lang=tr&lat=39.0&lon=35.0&zoom=6&location_bias_scale=0.9`;
        const res = await fetchWithTimeout(url, { signal: localController.signal }, 9000);
        if (!res.ok) throw new Error(`Photon API hata kodu: ${res.status}`);
        const data = await res.json();
        return data.features || [];
      });
      photonConsecutiveFailures = 0; // başarılı oldu, sayaç sıfırlanır
      renderSuggestions(sortFeaturesTurkeyFirst(features, query), 'photon');
      return;
    } catch (err) {
      if (err.name === 'AbortError') return;
      console.warn('Photon başarısız, Nominatim deneniyor:', err.message);
      photonConsecutiveFailures++;
      if (photonConsecutiveFailures >= PHOTON_FAILURE_THRESHOLD) {
        photonDisabledUntil = Date.now() + PHOTON_COOLDOWN_MS;
        console.warn(`Photon art arda ${photonConsecutiveFailures} kez başarısız oldu, ${PHOTON_COOLDOWN_MS / 1000}sn boyunca atlanacak.`);
      }
    }
  }

  // 2) Photon başarısız oldu → Nominatim dene
  try {
    const features = await nominatimQueue.enqueue(async () => {
      // countrycodes=tr ile Türkiye'deki sonuçlar öncelikli getirilir, ancak
      // bu tek başına yurt dışı aramaları imkansız kılmaz çünkü aşağıda
      // "hiç sonuç yoksa countrycodes olmadan tekrar dene" mantığı da var.
      const url = `${ENDPOINTS.nominatimSearch}?q=${encodeURIComponent(query)}&format=jsonv2&limit=6&addressdetails=1&countrycodes=tr`;
      const res = await fetchWithTimeout(url, {
        headers: { 'Accept-Language': 'tr' },
        signal: localController.signal,
      }, 9000);
      if (!res.ok) throw new Error(`Nominatim hata kodu: ${res.status}`);
      let data = await res.json();

      // Türkiye'de hiç sonuç bulunamadıysa (ör. yurt dışı bir yer aranıyor),
      // ülke kısıtlaması olmadan tekrar dene.
      if (!data || data.length === 0) {
        const fallbackUrl = `${ENDPOINTS.nominatimSearch}?q=${encodeURIComponent(query)}&format=jsonv2&limit=6&addressdetails=1`;
        const fallbackRes = await fetchWithTimeout(fallbackUrl, {
          headers: { 'Accept-Language': 'tr' },
          signal: localController.signal,
        }, 9000);
        if (fallbackRes.ok) data = await fallbackRes.json();
      }

      return (data || []).map(nominatimResultToFeature);
    });
    renderSuggestions(sortFeaturesTurkeyFirst(features, query), 'nominatim');
    return;
  } catch (err) {
    if (err.name === 'AbortError') return;
    console.warn('Nominatim de başarısız:', err.message);
  }

  // 3) İkisi de başarısız → daha önce LocationIQ key girildiyse onunla dene
  if (locationIqApiKey) {
    try {
      const features = await runLocationIqSearch(query, localController.signal);
      renderSuggestions(features, 'locationiq');
      return;
    } catch (err) {
      if (err.name === 'AbortError') return;
      console.error('LocationIQ de başarısız:', err.message);
      suggestionsBox.innerHTML = `<div class="suggestion-empty"><i class="fa-solid fa-triangle-exclamation"></i> LocationIQ anahtarınızla da arama yapılamadı: ${escapeHtml(err.message)}</div>`;
      toast('LocationIQ araması başarısız oldu. Anahtarınızı kontrol edin.', 'error', 'Arama Hatası');
      return;
    }
  }

  // 4) Hiçbir anahtarsız servis çalışmadı ve key de girilmemiş → kullanıcıya bilgi + opsiyonel key formu göster
  keylessSearchFailed = true;
  renderKeylessFailureNotice();
}

/** Nominatim /search sonucunu Photon'un feature formatına dönüştürür (ortak renderSuggestions için) */
function nominatimResultToFeature(item) {
  const addr = item.address || {};
  return {
    geometry: { coordinates: [parseFloat(item.lon), parseFloat(item.lat)] },
    properties: {
      name: item.name || item.display_name?.split(',')[0] || 'Bilinmeyen konum',
      street: addr.road,
      city: addr.city || addr.town || addr.village,
      state: addr.state,
      country: addr.country,
      countrycode: (addr.country_code || '').toUpperCase(),
    },
  };
}

/**
 * Photon sonuçlarını Türkiye önceliğiyle yeniden sıralar. Photon'un kendi
 * lat/lon/zoom bias parametreleri (yukarıda gönderiliyor) genellikle işe
 * yarar ama garanti değildir — bu client-side ek katman, iki kritere göre
 * sonuçları öne alır: (1) countrycode === 'TR' olanlar, (2) yazılan sorguyla
 * BİREBİR (büyük/küçük harf ve Türkçe karakter duyarsız) eşleşen isimler.
 * Sıralama stabildir: eşit öncelikli sonuçlar arasında Photon'un orijinal
 * sırası korunur, tamamen farklı bir sonuç kümesi üretilmez.
 */
function sortFeaturesTurkeyFirst(features, query) {
  const normalizedQuery = normalizeTurkish(query);

  return features
    .map((f, originalIndex) => ({ f, originalIndex }))
    .sort((a, b) => {
      const scoreA = turkeyRelevanceScore(a.f, normalizedQuery);
      const scoreB = turkeyRelevanceScore(b.f, normalizedQuery);
      if (scoreA !== scoreB) return scoreB - scoreA; // yüksek skor önce
      return a.originalIndex - b.originalIndex; // stabil sıralama
    })
    .map((x) => x.f);
}

function turkeyRelevanceScore(feature, normalizedQuery) {
  const props = feature.properties || {};
  const name = normalizeTurkish(props.name || '');
  let score = 0;
  if (props.countrycode === 'TR') score += 2;
  if (name === normalizedQuery) score += 3; // tam isim eşleşmesi (ör. "trabzon" -> "Trabzon")
  else if (name.startsWith(normalizedQuery)) score += 1;
  return score;
}

/** Türkçe karakterleri sadeleştirip küçük harfe çevirir (karşılaştırma için) */
function normalizeTurkish(str) {
  return (str || '')
    .toLocaleLowerCase('tr')
    .replace(/ı/g, 'i').replace(/İ/g, 'i')
    .replace(/ğ/g, 'g').replace(/ü/g, 'u')
    .replace(/ş/g, 's').replace(/ö/g, 'o').replace(/ç/g, 'c')
    .trim();
}

async function runLocationIqSearch(query, signal) {
  const url = `${ENDPOINTS.locationIq}?key=${encodeURIComponent(locationIqApiKey)}&q=${encodeURIComponent(query)}&format=json&limit=6&accept-language=tr`;
  const res = await fetchWithTimeout(url, { signal }, 9000);
  if (!res.ok) {
    if (res.status === 401 || res.status === 403) {
      throw new Error('Geçersiz API anahtarı (401/403).');
    }
    throw new Error(`LocationIQ hata kodu: ${res.status}`);
  }
  const data = await res.json();
  return (data || []).map((item) => ({
    geometry: { coordinates: [parseFloat(item.lon), parseFloat(item.lat)] },
    properties: {
      name: item.display_name?.split(',')[0] || 'Bilinmeyen konum',
      street: item.address?.road,
      city: item.address?.city || item.address?.town || item.address?.village,
      state: item.address?.state,
      country: item.address?.country,
    },
  }));
}

let suggestionFeatures = [];
let suggestionActiveIndex = -1;

function renderSuggestions(features, source = 'photon') {
  suggestionFeatures = features;
  // Liste dolduğunda en üstteki öneri varsayılan olarak aktif kabul edilir;
  // böylece kullanıcı ok tuşlarına hiç dokunmadan doğrudan Enter'a basınca
  // ilk sonuç otomatik seçilir.
  suggestionActiveIndex = features.length ? 0 : -1;

  if (!features.length) {
    suggestionsBox.innerHTML = `<div class="suggestion-empty"><i class="fa-solid fa-circle-question"></i> Sonuç bulunamadı.</div>`;
    searchInput.setAttribute('aria-expanded', 'false');
    return;
  }

  searchInput.setAttribute('aria-expanded', 'true');
  suggestionsBox.innerHTML = '';
  features.forEach((f, idx) => {
    const props = f.properties || {};
    const [lng, lat] = f.geometry.coordinates;
    const title = props.name || props.street || 'Bilinmeyen konum';
    const subParts = [props.street, props.city, props.state, props.country].filter(Boolean);
    const sub = subParts.filter((p) => p !== title).join(', ');

    const item = document.createElement('div');
    item.className = 'suggestion-item';
    item.id = `suggestion-${idx}`;
    item.setAttribute('role', 'option');
    item.innerHTML = `
      <i class="fa-solid fa-location-dot"></i>
      <div>
        <div class="s-title">${escapeHtml(title)}</div>
        <div class="s-sub">${escapeHtml(sub)}</div>
      </div>`;
    item.addEventListener('click', () => {
      suggestionsBox.classList.add('hidden');
      searchInput.value = '';
      handleSuggestionPick(lat, lng, title, sub);
    });
    suggestionsBox.appendChild(item);
  });

  // İlk sonucu görsel olarak da vurgula (Enter ile doğrudan seçilebileceğini belli eder)
  updateActiveSuggestion(Array.from(suggestionsBox.querySelectorAll('.suggestion-item')));
}

/** Ok tuşlarıyla önerilerde gezinme + Enter ile seçme (klavye erişilebilirliği) */
searchInput.addEventListener('keydown', (e) => {
  const items = Array.from(suggestionsBox.querySelectorAll('.suggestion-item'));
  if (!items.length || suggestionsBox.classList.contains('hidden')) return;

  if (e.key === 'ArrowDown') {
    e.preventDefault();
    suggestionActiveIndex = Math.min(suggestionActiveIndex + 1, items.length - 1);
    updateActiveSuggestion(items);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    suggestionActiveIndex = Math.max(suggestionActiveIndex - 1, 0);
    updateActiveSuggestion(items);
  } else if (e.key === 'Enter') {
    if (suggestionActiveIndex >= 0 && suggestionFeatures[suggestionActiveIndex]) {
      e.preventDefault();
      const f = suggestionFeatures[suggestionActiveIndex];
      const [lng, lat] = f.geometry.coordinates;
      const title = f.properties?.name || f.properties?.street || 'Bilinmeyen konum';
      suggestionsBox.classList.add('hidden');
      searchInput.value = '';
      handleSuggestionPick(lat, lng, title, '');
    }
  } else if (e.key === 'Escape') {
    suggestionsBox.classList.add('hidden');
  }
});

function updateActiveSuggestion(items) {
  items.forEach((el, i) => {
    el.classList.toggle('kbd-active', i === suggestionActiveIndex);
    if (i === suggestionActiveIndex) el.scrollIntoView({ block: 'nearest' });
  });
}

function escapeHtml(str = '') {
  const div = document.createElement('div');

/**
 * Ortak geolocation akışı: tarayıcı desteği, HTTPS/güvenli bağlam ve izin durumlarına
 * göre anlaşılır Türkçe hata mesajları üretir, başarılı sonucu callback'e iletir.
 */
function runGeolocation(onSuccess) {
  if (!navigator.geolocation) {
    toast('Tarayıcınız konum servisini desteklemiyor.', 'error', 'Konum Hatası');
    return;
  }
  // Konum API'si güvenli bağlam (HTTPS veya localhost) dışında genelde sessizce
  // reddedilir; kullanıcıya bunun sebebini açıkça belirtelim.
  if (!window.isSecureContext) {
    toast('Konum servisi yalnızca güvenli (HTTPS) bağlantılarda çalışır. Lütfen siteye https:// üzerinden erişin.', 'error', 'Konum Hatası');
    return;
  }
  toast('Konumunuz alınıyor…', 'info');
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      onSuccess(pos.coords.latitude, pos.coords.longitude);
    },
    (err) => {
      let msg = err.message || 'Konum alınamadı.';
      if (err.code === err.PERMISSION_DENIED) {
        msg = 'Konum izni reddedildi. Tarayıcı/site ayarlarından konum iznini açıp tekrar deneyin.';
      } else if (err.code === err.POSITION_UNAVAILABLE) {
        msg = 'Konum bilgisi alınamadı. Cihazınızın konum servislerinin açık olduğundan emin olun.';
      } else if (err.code === err.TIMEOUT) {
        msg = 'Konum isteği zaman aşımına uğradı. Lütfen tekrar deneyin.';
      }
      toast(msg, 'error', 'Konum Hatası');
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 }
  );
}

/**
 * Haritanın o anki Leaflet zoom seviyesine karşılık gelen Nominatim "zoom"
 * (adres detay) seviyesini döndürür. Nominatim'de zoom parametresi, hangi
 * idari/coğrafi seviyede isim aranacağını belirler (3≈ülke, 8≈il, 10≈ilçe,
 * 14≈mahalle/köy, 18≈sokak/bina). Sabit bir değer yerine haritanın gerçek
 * yakınlaşma seviyesini kullanarak, uzaktan tıklanan bir noktada şehir/il
 * adı, iyice yakınlaşılmış bir noktada ise mahalle/cadde adı dönmesini
 * sağlıyoruz — önceki sabit "14" değeri uzaktaki tıklamalarda çoğu zaman
 * sonuçsuz kalıp durağın adının "Durak" olarak kalmasına yol açıyordu.
 */
function nominatimZoomForMapZoom(mapZoom) {
  if (mapZoom <= 6) return 5;   // ülke / bölge
  if (mapZoom <= 8) return 6;   // il (büyük ölçek)
  if (mapZoom <= 10) return 10; // il / büyük ilçe
  if (mapZoom <= 12) return 12; // ilçe
  if (mapZoom <= 14) return 14; // ilçe / mahalle-köy
  if (mapZoom <= 16) return 16; // mahalle / semt
  return 18;                     // cadde / sokak / bina
}

/* ============================================================
   7. HARİTA TIKLAMA DOĞRULAMASI (Su Tespiti & Snap-to-Road)
   ============================================================ */
let isProcessingMapClick = false;

async function onMapClick(e) {
  // Mobilde parmakla art arda hızlı dokunulduğunda, önceki konum doğrulama
  // isteği bitmeden yenisinin başlamasını (üst üste toast/istek birikmesini)
  // önlemek için basit bir kilit kullanıyoruz.
  if (isProcessingMapClick) return;
  isProcessingMapClick = true;

  const { lat, lng } = e.latlng;
  const clickZoom = map.getZoom();

  const loadingToast = Swal.fire({
    toast: true, position: 'top-end', showConfirmButton: false,
    didOpen: () => Swal.showLoading(),
    title: 'Konum doğrulanıyor…',
    customClass: { popup: 'rotalis-toast' },
  });

  try {
    // a) Nominatim Reverse Geocoding ile su yüzeyi kontrolü (hızlı ama denizin
    // açığında genelde en yakın kıyı yerleşimini döndürdüğü için tek başına
    // güvenilir değildir — bkz. (b) asıl belirleyici kontrol).
    const isWaterByGeocode = await checkIsWater(lat, lng);

    if (isWaterByGeocode) {
      Swal.close();
      toast('Deniz/Göl/Su yüzeyi seçilemez. Lütfen kara parçası üzerinde bir nokta seçin.', 'error', 'Geçersiz Konum');
      return;
    }

    // b) OSRM nearest ile en yakın karayoluna snap + o yola olan gerçek mesafe.
    // Tıklanan nokta hiçbir karayoluna makul mesafede değilse (deniz ortası, geniş
    // göl, ıssız arazi vb.) snap uygulamak yanlış bir noktaya ("en yakın yol"a)
    // durak eklenmesine yol açar; bunun yerine kullanıcıyı bilgilendiriyoruz.
    const snapped = await snapToRoad(lat, lng);
    Swal.close();

    if (snapped.distanceToRoad > MAX_SNAP_DISTANCE_M) {
      toast('Bu nokta bir karayoluna yakın değil (deniz, göl veya boş arazi olabilir). Lütfen kara parçası üzerinde, yola yakın bir nokta seçin.', 'error', 'Geçersiz Konum');
      return;
    }

    // OSRM'in verdiği yol/cadde adı sadece yakın zoom seviyelerinde anlamlı
    // bir "durak adı" olur (ör. "Atatürk Bulvarı"). Uzaktan (şehir/il ölçeğinde)
    // tıklandığında OSRM ismi çoğu zaman boş gelir veya tek başına yetersiz
    // kalır; bu durumda haritanın o anki zoom seviyesine göre (il/ilçe/mahalle)
    // Nominatim'den yer adı alıp durağa onu veriyoruz.
    let stopName = snapped.name;
    if (!stopName || clickZoom < 15) {
      const geocodedName = await reverseGeocodeName(snapped.lat, snapped.lng, clickZoom);
      stopName = geocodedName || snapped.name || 'Durak';
    }

    await addStopDirect(snapped.lat, snapped.lng, stopName, '', false);
  } catch (err) {
    Swal.close();
    console.error('Harita tıklama doğrulama hatası:', err);
    toast('Konum doğrulanamadı. Servislere ulaşılamıyor olabilir, yine de durak eklendi.', 'error');
    // Ağ hatası olsa bile kullanıcı deneyimini kesmemek için ham koordinatla ekle
    await addStopDirect(lat, lng, 'Durak', '', false);
  } finally {
    isProcessingMapClick = false;
  }
}

/**
 * Verilen koordinat için Nominatim reverse geocoding kullanarak okunabilir
 * bir yer adı (il/ilçe/mahalle/köy/sokak vb.) döndürür. Durak bir yere
 * sürüklenip bırakıldığında (dragend), haritada yeni bir noktaya
 * taşındığında veya haritaya uzaktan tıklandığında kullanılır.
 *
 * `mapZoom` verildiğinde, hem Nominatim'e sorulan detay seviyesi hem de
 * yanıttaki hangi adres alanının öncelikli okunacağı haritanın o anki
 * yakınlaşma seviyesine göre ayarlanır: uzaktan tıklamada il/ilçe adı,
 * yakından tıklamada mahalle/cadde adı döner. `mapZoom` verilmezse (ör.
 * sürükle-bırak sonrası, harita zaten yakın olduğundan) eski davranış
 * korunur: sabit zoom=14 ile mahalle/köy seviyesinde arama yapılır.
 *
 * Servise ulaşılamazsa ya da adres bulunamazsa null döner; çağıran taraf bu
 * durumda mevcut ismi korumalıdır.
 */
async function reverseGeocodeName(lat, lng, mapZoom = null) {
  const nomZoom = mapZoom != null ? nominatimZoomForMapZoom(mapZoom) : 14;

  try {
    return await nominatimQueue.enqueue(async () => {
      const url = `${ENDPOINTS.nominatimReverse}?format=jsonv2&lat=${lat}&lon=${lng}&zoom=${nomZoom}&addressdetails=1`;
      const res = await fetchWithTimeout(url, { headers: { 'Accept-Language': 'tr' } }, 9000);
      if (!res.ok) throw new Error(`Nominatim hata kodu: ${res.status}`);
      const data = await res.json();
      const addr = data.address || {};

      // Zoom seviyesine göre öncelik sırası değişir: uzaktan bakışta önce
      // il/ilçe gibi geniş kapsamlı bir isim aranır (mahalle adı tek başına
      // anlamsız kalır), yakından bakışta önce sokak/mahalle gibi dar
      // kapsamlı, daha spesifik bir isim aranır.
      const name = nomZoom <= 10
        // Uzak görünüm: il / büyük ilçe seviyesi
        ? (addr.province || addr.state || addr.city || addr.county ||
           addr.district || data.display_name?.split(',')[0])
        : nomZoom <= 14
        // Orta görünüm: ilçe / mahalle-köy seviyesi
        ? (addr.district || addr.county || addr.town || addr.village ||
           addr.suburb || addr.neighbourhood || addr.city ||
           data.display_name?.split(',')[0])
        // Yakın görünüm: mahalle / cadde-sokak seviyesi
        : (addr.road
            ? (addr.house_number ? `${addr.road} ${addr.house_number}` : addr.road)
            : addr.neighbourhood || addr.suburb || addr.village ||
              data.display_name?.split(',')[0]);

      return name || null;
    });
  } catch (err) {
    console.warn('Ters coğrafi kodlama başarısız oldu:', err);
    return null;
  }
}

async function checkIsWater(lat, lng) {

  return nominatimQueue.enqueue(async () => {
    const url = `${ENDPOINTS.nominatimReverse}?format=jsonv2&lat=${lat}&lon=${lng}&zoom=14&addressdetails=0`;
    const res = await fetchWithTimeout(url, {
      headers: { 'Accept-Language': 'tr' },
    }, 9000);
    if (!res.ok) throw new Error(`Nominatim hata kodu: ${res.status}`);
    const data = await res.json();

    const type = data.type;
    const cls = data.class;

    if (cls === 'natural' && WATER_TAGS.has(type)) return true;
    if (cls === 'place' && WATER_PLACE_TAGS.has(type)) return true;
    if (cls === 'waterway') return true;
    if (type === 'water' || type === 'bay' || type === 'strait' || type === 'glacier') return true;

    return false;
  });
}

async function snapToRoad(lat, lng) {
  const url = `${ENDPOINTS.osrmNearest}${lng},${lat}?number=1`;
  const res = await fetchWithTimeout(url, {}, 9000);
  if (!res.ok) throw new Error(`OSRM nearest hata kodu: ${res.status}`);
  const data = await res.json();

  if (data.code !== 'Ok' || !data.waypoints?.length) {
    // Snap başarısızsa orijinal koordinatı kullan
    return { lat, lng, name: 'Durak', distanceToRoad: Infinity };
  }
  const wp = data.waypoints[0];
  const snappedLat = wp.location[1];
  const snappedLng = wp.location[0];
  // OSRM zaten yol üzerindeki en yakın noktayı ve o noktaya olan mesafeyi (metre)
  // döndürür (wp.distance). Bu mesafe çok büyükse (deniz ortası, göl, dağ başı vb.)
  // tıklanan yerin karayoluna gerçekten yakın olmadığı, dolayısıyla muhtemelen
  // bir su/boş alan üzerine tıklandığı anlaşılır.
  const distanceToRoad = typeof wp.distance === 'number'
    ? wp.distance
    : haversineMeters(lat, lng, snappedLat, snappedLng);
  return { lat: snappedLat, lng: snappedLng, name: wp.name || 'Durak', distanceToRoad };
}

// Tıklanan nokta ile OSRM'in bulduğu en yakın karayolu arasındaki mesafe bu değeri
// aşarsa, snap uygulanmaz ve kullanıcıdan kara parçası üzerinde bir nokta seçmesi istenir.
const MAX_SNAP_DISTANCE_M = 3000;

/* ============================================================
   8. DURAK YÖNETİMİ (Ekle / Sil / Sırala / Render)
   ============================================================ */
function stopTypeFor(index, total) {
  if (index === 0) return 'start';
  if (index === total - 1) return 'end';
  return 'stop';
}

async function addStopDirect(lat, lng, name, sub = '', isGps = false) {
  const stop = { id: uid(), lat, lng, name: name || 'Durak', sub, isGps };
  state.stops.push(stop);
  renderStops();
  renderStopMarkers();
  toast(`"${stop.name}" listeye eklendi.`, 'success', 'Durak Eklendi');

  // 2+ durak varsa rotayı otomatik hesapla
  if (state.stops.length >= 2) {
    await calculateRoute();
  } else {
    saveSessionToStorage();
  }
}

function removeStop(id) {
  state.stops = state.stops.filter((s) => s.id !== id);
  renderStops();
  renderStopMarkers();
  if (state.stops.length >= 2) {
    calculateRoute();
  } else {
    clearRouteVisuals();
  }
  saveSessionToStorage();
}

// Harita üzerindeki durak pin'inin popup'ındaki silme (X) butonundan çağrılır.
// Popup içeriği Leaflet tarafından ham HTML olarak render edildiğinden,
// inline onclick üzerinden erişilebilmesi için fonksiyon window'a bağlanıyor.
window.__removeStopFromPopup = function (id) {
  map.closePopup();
  removeStop(id);
};

function clearAllStops() {
  if (!state.stops.length) return;
  Swal.fire({
    title: 'Tüm duraklar silinsin mi?',
    text: 'Bu işlem geri alınamaz.',
    icon: 'warning',
    showCancelButton: true,
    confirmButtonText: 'Evet, temizle',
    cancelButtonText: 'Vazgeç',
    background: '#0d1218',
    color: '#e2e8f0',
    confirmButtonColor: '#ef5a6f',
    cancelButtonColor: '#334155',
  }).then((result) => {
    if (result.isConfirmed) {
      state.stops = [];
      renderStops();
      renderStopMarkers();
      clearRouteVisuals();
      localStorage.removeItem(STORAGE_KEY);
      toast('Tüm duraklar temizlendi.', 'success');
    }
  });
}

const stopListEl = document.getElementById('stop-list');
const stopEmptyHint = document.getElementById('stop-empty-hint');
const stopCountEl = document.getElementById('stop-count');

function renderStops() {
  stopListEl.innerHTML = '';
  stopCountEl.textContent = `${state.stops.length} nokta`;
  stopEmptyHint.classList.toggle('hidden', state.stops.length > 0);

  state.stops.forEach((stop, idx) => {
    const type = stopTypeFor(idx, state.stops.length);
    const cfg = PIN_ICONS[type];
    const li = document.createElement('li');
    li.className = 'stop-card';
    li.dataset.id = stop.id;
    li.innerHTML = `
      <i class="fa-solid fa-grip-vertical drag-handle"></i>
      <div class="stop-marker map-pin-flat ${cfg.cls}" style="transform:none; border-radius:8px;">
        <i class="fa-solid ${cfg.icon}" style="font-size:11px;"></i>
      </div>
      <div class="stop-info">
        <div class="stop-title">${escapeHtml(stop.name)}</div>
        <div class="stop-sub">${type === 'start' ? 'Başlangıç' : type === 'end' ? 'Bitiş' : 'Ara Durak'} · ${stop.lat.toFixed(4)}, ${stop.lng.toFixed(4)}</div>
      </div>
      <button class="stop-remove" title="Kaldır"><i class="fa-solid fa-xmark"></i></button>
    `;
    li.querySelector('.stop-remove').addEventListener('click', (e) => {
      e.stopPropagation();
      removeStop(stop.id);
    });

    // Sağ tık (contextmenu) veya uzun basma ile durak tipi menüsü
    li.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      openStopContextMenu(stop.id, e.clientX, e.clientY);
    });
    let longPressTimer = null;
    let touchStartX = 0, touchStartY = 0;
    const LONG_PRESS_MOVE_TOLERANCE = 10; // px — bu kadar hareket "kaydırma" sayılır, menüyü iptal eder
    li.addEventListener('touchstart', (e) => {
      const touch = e.touches[0];
      touchStartX = touch.clientX;
      touchStartY = touch.clientY;
      longPressTimer = setTimeout(() => openStopContextMenu(stop.id, touch.clientX, touch.clientY), 420);
    }, { passive: true });
    li.addEventListener('touchend', () => clearTimeout(longPressTimer));
    li.addEventListener('touchmove', (e) => {
      const touch = e.touches[0];
      const dx = Math.abs(touch.clientX - touchStartX);
      const dy = Math.abs(touch.clientY - touchStartY);
      if (dx > LONG_PRESS_MOVE_TOLERANCE || dy > LONG_PRESS_MOVE_TOLERANCE) {
        clearTimeout(longPressTimer);
      }
    }, { passive: true });

    stopListEl.appendChild(li);
  });

  initSortable();
}

/* ============================================================
   6b. DURAK TİPİ CONTEXT-MENU (Başlangıç / Ara Durak / Bitiş)
   ============================================================ */
const stopContextMenu = document.getElementById('stop-context-menu');

function openStopContextMenu(stopId, x, y) {
  state.contextMenuStopId = stopId;
  stopContextMenu.classList.remove('hidden');
  stopContextMenu.classList.add('flex');

  // Ekran taşmasını önlemek için konumu sınırla
  const menuWidth = 190, menuHeight = 150;
  const clampedX = Math.min(x, window.innerWidth - menuWidth - 10);
  const clampedY = Math.min(y, window.innerHeight - menuHeight - 10);
  stopContextMenu.style.left = `${Math.max(8, clampedX)}px`;
  stopContextMenu.style.top = `${Math.max(8, clampedY)}px`;
}

function closeStopContextMenu() {
  stopContextMenu.classList.add('hidden');
  stopContextMenu.classList.remove('flex');
  state.contextMenuStopId = null;
}

document.addEventListener('click', (e) => {
  if (!stopContextMenu.contains(e.target)) closeStopContextMenu();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeStopContextMenu();
});

stopContextMenu.querySelectorAll('.ctx-menu-item').forEach((btn) => {
  btn.addEventListener('click', () => {
    const role = btn.dataset.role;
    const stopId = state.contextMenuStopId;
    if (!stopId) return;

    if (role === 'remove') {
      closeStopContextMenu();
      removeStop(stopId);
      return;
    }
    applyManualStopRole(stopId, role);
    closeStopContextMenu();
  });
});

/**
 * Kullanıcının "Başlangıç Yap" / "Bitiş Yap" seçimine göre listeyi yeniden düzenler.
 * Not: state.stops dizisindeki SIRA, tip (start/stop/end) belirler — bu yüzden
 * manuel rol ataması, ilgili durağı dizinin başına/sonuna taşımak anlamına gelir.
 */
function applyManualStopRole(stopId, role) {
  const idx = state.stops.findIndex((s) => s.id === stopId);
  if (idx === -1) return;
  const [stop] = state.stops.splice(idx, 1);

  if (role === 'start') {
    state.stops.unshift(stop);
    toast(`"${stop.name}" başlangıç noktası yapıldı.`, 'success');
  } else if (role === 'end') {
    state.stops.push(stop);
    toast(`"${stop.name}" bitiş noktası yapıldı.`, 'success');
  } else {
    // 'stop' → aradaki bir konuma (başlangıç/bitiş olmayacak şekilde) yerleştir
    const insertAt = state.stops.length > 0 ? 1 : 0;
    state.stops.splice(Math.min(insertAt, state.stops.length), 0, stop);
    toast(`"${stop.name}" ara durak yapıldı.`, 'success');
  }

  renderStops();
  renderStopMarkers();
  if (state.stops.length >= 2) calculateRoute();
}

function initSortable() {
  if (sortableInstance) sortableInstance.destroy();
  sortableInstance = Sortable.create(stopListEl, {
    handle: '.drag-handle',
    animation: 180,
    ghostClass: 'sortable-ghost',
    chosenClass: 'sortable-chosen',
    onEnd: () => {
      const newOrderIds = Array.from(stopListEl.children).map((el) => el.dataset.id);
      state.stops.sort((a, b) => newOrderIds.indexOf(a.id) - newOrderIds.indexOf(b.id));
      renderStops();
      renderStopMarkers();
      if (state.stops.length >= 2) calculateRoute();
    },
  });
}

function renderStopMarkers() {
  stopMarkersLayer.clearLayers();
  state.stops.forEach((stop, idx) => {
    const type = stopTypeFor(idx, state.stops.length);
    const marker = L.marker([stop.lat, stop.lng], { icon: makePinIcon(type), draggable: true });
    marker.bindPopup(`
      <button type="button" class="stop-popup-remove-only" onclick="window.__removeStopFromPopup('${stop.id}')" title="Bu durağı sil" aria-label="Bu durağı sil">
        <i class="fa-solid fa-trash-can"></i> Durağı Sil
      </button>
    `, { closeButton: false, className: 'stop-delete-popup' });
    marker.bindTooltip(`<span class="pin-label-inner">${escapeHtml(stop.name)}</span>`, {
      permanent: true,
      direction: 'right',
      offset: [10, -14],
      className: 'pin-label-tooltip',
    });
    marker.on('dragend', async (ev) => {
      const { lat, lng } = ev.target.getLatLng();
      stop.lat = lat;
      stop.lng = lng;
      // Durak yeni bir konuma taşındı; eski isim ("Ankara" gibi) artık
      // geçersiz olabileceği için yeni konuma göre yeniden adlandırıyoruz.
      stop.name = 'Konum güncelleniyor…';
      renderStops();
      renderStopMarkers();
      const newName = await reverseGeocodeName(lat, lng, map.getZoom());
      stop.name = newName || `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
      renderStops();
      renderStopMarkers();
      if (state.stops.length >= 2) await calculateRoute();
      saveSessionToStorage();
    });
    marker.addTo(stopMarkersLayer);
  });
}

document.getElementById('btn-clear-stops').addEventListener('click', clearAllStops);

/* Sırayı optimize et: OSRM Trip servisi ile en verimli ziyaret sırası */
document.getElementById('btn-optimize').addEventListener('click', async () => {
  if (state.stops.length < 3) {
    toast('Optimizasyon için en az 3 durak gerekli.', 'info');
    return;
  }
  const btn = document.getElementById('btn-optimize');
  btn.disabled = true;
  btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Optimize ediliyor…`;

  try {
    const coords = state.stops.map((s) => `${s.lng},${s.lat}`).join(';');
    const url = `${ENDPOINTS.osrmTrip}${coords}?source=first&destination=last&roundtrip=false&overview=false`;
    const res = await fetchWithTimeout(url, {}, 12000);
    if (!res.ok) throw new Error(`OSRM trip hata kodu: ${res.status}`);
    const data = await res.json();
    if (data.code !== 'Ok') throw new Error('Trip optimizasyonu başarısız: ' + data.code);

    // waypoints, orijinal input sırasına göre "waypoint_index" verir; buna göre yeniden sırala
    const order = data.waypoints
      .map((wp, originalIdx) => ({ originalIdx, tripIdx: wp.waypoint_index }))
      .sort((a, b) => a.tripIdx - b.tripIdx)
      .map((o) => o.originalIdx);

    state.stops = order.map((i) => state.stops[i]);
    renderStops();
    renderStopMarkers();
    await calculateRoute();
    toast('Durak sırası en verimli hale optimize edildi.', 'success', 'Optimizasyon Tamamlandı');
  } catch (err) {
    console.error('Optimizasyon hatası:', err);
    toast('Sıra optimizasyonu yapılamadı: ' + err.message, 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = `<i class="fa-solid fa-arrow-down-wide-short"></i> Sırayı Optimize Et`;
  }
});

/* ============================================================
   9. ROTA HESAPLAMA (OSRM route servisi)
   ============================================================ */
const routeSummarySection = document.getElementById('route-summary-section');
const fuelSection = document.getElementById('fuel-section');
const elevationSection = document.getElementById('elevation-section');
const poiSection = document.getElementById('poi-section');
const legListEl = document.getElementById('leg-list');
const totalDistanceEl = document.getElementById('total-distance');
const totalDurationEl = document.getElementById('total-duration');

document.getElementById('btn-calc-route').addEventListener('click', () => {
  if (state.stops.length < 2) {
    toast('Rota hesaplamak için en az 2 durak eklemelisiniz.', 'info');
    return;
  }
  calculateRoute();
});

async function calculateRoute() {
  if (state.stops.length < 2) return;

  const calcBtnFooter = document.getElementById('btn-calc-route-footer');
  const calcBtn = document.getElementById('btn-calc-route');
  const originalBtnHtml = calcBtn.innerHTML;
  calcBtn.disabled = true;
  calcBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Hesaplanıyor…`;
  showLegSkeleton();

  // Yeni rota gelene kadar eski çizgiyi soluklaştır (ani "flash" hissini azaltır)
  if (routeLine) routeLine.setStyle({ opacity: 0.28 });
  if (routeOutline) routeOutline.setStyle({ opacity: 0.15 });

  try {
    const coords = state.stops.map((s) => `${s.lng},${s.lat}`).join(';');
    // alternatives=true → OSRM uygun olduğunda birden fazla rota seçeneği döner (En hızlı / alternatif)
    const url = `${ENDPOINTS.osrmRoute}${coords}?geometries=geojson&steps=true&overview=full&alternatives=true`;
    const res = await fetchWithTimeout(url, {}, 15000);
    if (!res.ok) throw new Error(`OSRM route hata kodu: ${res.status}`);
    const data = await res.json();

    if (data.code !== 'Ok' || !data.routes?.length) {
      throw new Error('Bu duraklar arasında karayolu rotası bulunamadı.');
    }

    state.routeAlternatives = data.routes;
    state.selectedRouteIndex = 0;
    renderRouteAlternatives();
    applySelectedRoute(0);

    saveSessionToStorage();
    // Rota otomatik olarak başarıyla hesaplandı; "Tekrar Dene" butonuna
    // artık ihtiyaç yok, gizli kalmaya devam etsin.
    calcBtnFooter.classList.add('hidden');
  } catch (err) {
    console.error('Rota hesaplama hatası:', err);
    toast('Rota hesaplanamadı: ' + err.message, 'error', 'Rota Hatası');
    // Hata durumunda eski rotayı tekrar tam opaklığa döndür
    if (routeLine) routeLine.setStyle({ opacity: 0.95 });
    if (routeOutline) routeOutline.setStyle({ opacity: 0.55 });
    // Otomatik hesaplama başarısız oldu; kullanıcının elle tekrar
    // deneyebilmesi için butonu görünür yapıyoruz.
    calcBtnFooter.classList.remove('hidden');
  } finally {
    calcBtn.disabled = false;
    calcBtn.innerHTML = originalBtnHtml;
  }
}

/** Seçilen rota indeksini state'e uygular: çizim, özet, yakıt, yükselti, POI zinciri */
function applySelectedRoute(index) {
  const route = state.routeAlternatives[index];
  if (!route) return;
  state.selectedRouteIndex = index;

  state.routeGeoJSON = route.geometry;
  state.routeLegs = route.legs.map((leg) => ({ distance: leg.distance, duration: leg.duration }));
  state.totalDistanceKm = route.distance / 1000;
  state.totalDurationMin = route.duration / 60;

  drawRoute(route.geometry);
  renderRouteSummary();
  updateFuelCalculation();
  updateAltRouteSelectionUI();

  routeSummarySection.classList.remove('hidden');
  fuelSection.classList.remove('hidden');
  elevationSection.classList.remove('hidden');
  poiSection.classList.remove('hidden');

  fetchElevationProfile(route.geometry.coordinates);

  if (state.activePoiTypes.size > 0) {
    searchPOIsAlongRoute();
  }
}

/** Birden fazla rota seçeneği varsa panelde seçilebilir kartlar olarak listeler */
const altRouteSection = document.getElementById('route-alternatives-section');
const altRouteListEl = document.getElementById('alt-route-list');

function renderRouteAlternatives() {
  if (state.routeAlternatives.length < 2) {
    altRouteSection.classList.add('hidden');
    return;
  }
  altRouteSection.classList.remove('hidden');
  altRouteListEl.innerHTML = '';

  // En kısa mesafeli olanı "En Kısa", en az süreli olanı "En Hızlı" etiketiyle işaretle
  const fastestIdx = state.routeAlternatives.reduce((best, r, i, arr) => r.duration < arr[best].duration ? i : best, 0);
  const shortestIdx = state.routeAlternatives.reduce((best, r, i, arr) => r.distance < arr[best].distance ? i : best, 0);

  state.routeAlternatives.forEach((route, i) => {
    let badge = `Seçenek ${i + 1}`;
    if (i === fastestIdx && i === shortestIdx) badge = 'En İyi';
    else if (i === fastestIdx) badge = 'En Hızlı';
    else if (i === shortestIdx) badge = 'En Kısa';

    const card = document.createElement('div');
    card.className = 'alt-route-card';
    card.dataset.index = i;
    card.dataset.selected = (i === state.selectedRouteIndex).toString();
    card.innerHTML = `
      <div class="flex items-center gap-2">
        <span class="alt-badge">${badge}</span>
      </div>
      <span class="alt-nums">${formatDistance(route.distance)} ${distanceUnitLabel()} · ${formatDurationMin(route.duration)}</span>
    `;
    card.addEventListener('click', () => {
      applySelectedRoute(i);
    });
    altRouteListEl.appendChild(card);
  });
}

function updateAltRouteSelectionUI() {
  altRouteListEl.querySelectorAll('.alt-route-card').forEach((card) => {
    card.dataset.selected = (parseInt(card.dataset.index, 10) === state.selectedRouteIndex).toString();
  });
}

function showLegSkeleton() {
  legListEl.innerHTML = `
    <div class="skeleton-line"></div>
    <div class="skeleton-line"></div>`;
  routeSummarySection.classList.remove('hidden');
}

function drawRoute(geometry) {
  if (routeLine) map.removeLayer(routeLine);
  if (routeOutline) map.removeLayer(routeOutline);

  const latlngs = geometry.coordinates.map((c) => [c[1], c[0]]);

  // Dış çizgi (kontrast/glow efekti) — soluk başlayıp tam opaklığa geçiş yapar
  routeOutline = L.polyline(latlngs, {
    color: '#06120c',
    weight: 8,
    opacity: 0,
    lineJoin: 'round',
    lineCap: 'round',
  }).addTo(map);

  routeLine = L.polyline(latlngs, {
    color: '#3ddc97',
    weight: 4.5,
    opacity: 0,
    lineJoin: 'round',
    lineCap: 'round',
  }).addTo(map);

  map.fitBounds(routeLine.getBounds(), { padding: [60, 60] });

  // Bir sonraki frame'de tam opaklığa animasyonla geç (CSS transition SVG path üzerinde çalışır)
  requestAnimationFrame(() => {
    routeOutline.setStyle({ opacity: 0.55 });
    routeLine.setStyle({ opacity: 0.95 });
  });

  drawLegLabels(geometry.coordinates);
}

/**
 * En az 2 durak (1 bacak) olduğunda, her bacağın (iki ardışık durak arası) mesafe/süre
 * bilgisini haritada, o bacağın rota üzerindeki orta noktasına küçük bir etiket
 * olarak yerleştirir. Bacak sınırları, durak koordinatlarına rota geometrisi
 * üzerinde en yakın noktayı bularak (haversine ile) tespit edilir.
 */
function drawLegLabels(routeCoordinates) {
  legLabelsLayer.clearLayers();

  if (state.stops.length < 2 || state.routeLegs.length < 1) return; // en az 1 bacak (2 durak) gerekli

  // Rota koordinatlarını [lat, lng] olarak hazırla (haversine için)
  const routeLatLngs = routeCoordinates.map(([lng, lat]) => ({ lat, lng }));

  /** Verilen durağa rota üzerinde en yakın noktanın indeksini bulur */
  function nearestRouteIndex(stop, searchFromIndex) {
    let bestIdx = searchFromIndex;
    let bestDist = Infinity;
    for (let i = searchFromIndex; i < routeLatLngs.length; i++) {
      const d = haversineMeters(stop.lat, stop.lng, routeLatLngs[i].lat, routeLatLngs[i].lng);
      if (d < bestDist) { bestDist = d; bestIdx = i; }
    }
    return bestIdx;
  }

  let searchFrom = 0;
  const boundaryIndices = [0];
  for (let i = 1; i < state.stops.length; i++) {
    const idx = nearestRouteIndex(state.stops[i], searchFrom);
    boundaryIndices.push(idx);
    searchFrom = idx; // bir sonraki durağı bu noktadan itibaren ara (sıra karışmasın)
  }

  state.routeLegs.forEach((leg, i) => {
    const startIdx = boundaryIndices[i];
    const endIdx = boundaryIndices[i + 1];
    if (endIdx <= startIdx) return; // dejenere segment, atla

    const midIdx = Math.floor((startIdx + endIdx) / 2);
    const midPoint = routeLatLngs[midIdx];
    if (!midPoint) return;

    const label = L.marker([midPoint.lat, midPoint.lng], {
      icon: L.divIcon({
        className: '',
        html: `<div class="leg-map-label-wrap">
                 <div class="leg-map-label">${formatDistance(leg.distance)} ${distanceUnitLabel()} · ${formatDurationMin(leg.duration)}</div>
                 <div class="leg-map-label-connector"></div>
                 <div class="leg-map-label-dot"></div>
               </div>`,
        iconSize: [0, 0],
        iconAnchor: [0, 0],
      }),
      interactive: false,
      zIndexOffset: 500,
    });
    label.addTo(legLabelsLayer);
  });
}

function clearRouteVisuals() {
  if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
  if (routeOutline) { map.removeLayer(routeOutline); routeOutline = null; }
  if (legLabelsLayer) legLabelsLayer.clearLayers();
  routeSummarySection.classList.add('hidden');
  fuelSection.classList.add('hidden');
  elevationSection.classList.add('hidden');
  poiSection.classList.add('hidden');
  altRouteSection.classList.add('hidden');
  poiLayerGroup.clearLayers();
  state.routeGeoJSON = null;
  state.elevationPoints = [];
  state.routeAlternatives = [];
  state.selectedRouteIndex = 0;
  if (elevationChart) { elevationChart.destroy(); elevationChart = null; }
  saveSessionToStorage();
}

function renderRouteSummary() {
  totalDistanceEl.textContent = formatDistance(state.totalDistanceKm * 1000);
  document.getElementById('total-distance-unit').textContent = distanceUnitLabel();
  totalDurationEl.textContent = formatDurationMin(state.totalDurationMin * 60);

  legListEl.innerHTML = '';
  state.routeLegs.forEach((leg, i) => {
    const fromStop = state.stops[i];
    const toStop = state.stops[i + 1];
    const row = document.createElement('div');
    row.className = 'leg-row';
    row.innerHTML = `
      <span class="leg-label"><i class="fa-solid fa-arrow-right-long text-slate-500"></i> ${escapeHtml(truncate(fromStop.name, 12))} → ${escapeHtml(truncate(toStop.name, 12))}</span>
      <span class="leg-num">${formatDistance(leg.distance)} ${distanceUnitLabel()} · ${formatDurationMin(leg.duration)}</span>
    `;
    legListEl.appendChild(row);
  });
}

function truncate(str, n) {
  return str.length > n ? str.slice(0, n) + '…' : str;
}

/* ============================================================
   10. YAKIT VE MALİYET HESAPLAYICI
   ============================================================ */
const inputConsumption = document.getElementById('input-consumption');
const inputFuelPrice = document.getElementById('input-fuel-price');
const inputCurrency = document.getElementById('input-currency');
const fuelLitersEl = document.getElementById('fuel-liters');
const fuelCostEl = document.getElementById('fuel-cost');
const btnFetchAvgPrice = document.getElementById('btn-fetch-avg-price');
const btnFetchAvgPriceLabel = document.getElementById('btn-fetch-avg-price-label');
const fuelPriceSourceNote = document.getElementById('fuel-price-source-note');

/**
 * Yakıt türüne göre Türkiye ortalaması referans değerleri.
 *
 * ÖNEMLİ NOT: Türkiye'de akaryakıt fiyatları için ücretsiz, anahtarsız ve
 * tarayıcıdan (CORS) doğrudan çağrılabilen resmi/canlı bir API bulunmuyor
 * (EPDK gibi kurumlar canlı bir API yayınlamıyor, çoğu üçüncü parti servis
 * ücretli anahtar istiyor). Bu yüzden "otomatik çek" butonu, gerçek zamanlı
 * bir sunucudan veri çekmek yerine, burada tanımlı ve elle güncellenebilen
 * referans ortalamalarını forma yazar. Değerler tahminidir; kesin fiyat için
 * güncel bir kaynağı kontrol edin.
 *
 * REFERENCE_PRICES_UPDATED_AT değerini güncellediğinizde price alanlarını da
 * güncel Türkiye ortalamasıyla değiştirin.
 */
const REFERENCE_PRICES_UPDATED_AT = '2026-01'; // YYYY-AA — referans fiyatların ait olduğu dönem
const FUEL_TYPES = {
  benzin: { label: 'Benzin', icon: 'fa-gas-pump', avgPrice: 52.5, defaultConsumption: 7.5 },
  motorin: { label: 'Motorin', icon: 'fa-truck-fast', avgPrice: 50.5, defaultConsumption: 6.5 },
  lpg: { label: 'LPG', icon: 'fa-fire-flame-simple', avgPrice: 27.5, defaultConsumption: 9.0 },
};
let currentFuelType = 'benzin';

document.querySelectorAll('.fuel-type-btn').forEach((btn) => {
  btn.addEventListener('click', () => {
    currentFuelType = btn.dataset.fuelType;
    document.querySelectorAll('.fuel-type-btn').forEach((b) => b.classList.remove('active'));
    btn.classList.add('active');
    // Tür değişince, henüz kullanıcı tarafından elle değiştirilmemiş gibi
    // davranıp o türün varsayılan tüketimini öneriyoruz; fiyatı olduğu gibi
    // bırakıyoruz ki kullanıcı "Türkiye Ortalamasını Getir" ile bilinçli
    // şekilde güncellesin.
    if (state.unitSystem !== 'imperial') {
      inputConsumption.value = FUEL_TYPES[currentFuelType].defaultConsumption;
    }
    updateFuelCalculation();
    saveSessionToStorage();
  });
});

[inputConsumption, inputFuelPrice, inputCurrency].forEach((el) => {
  el.addEventListener('input', updateFuelCalculation);
});

/** "Türkiye Ortalamasını Getir" — bkz. yukarıdaki not: canlı bir API yerine
 * güncel tutulan referans ortalama değerini forma yazar. */
btnFetchAvgPrice.addEventListener('click', () => {
  const original = btnFetchAvgPriceLabel.textContent;
  btnFetchAvgPrice.disabled = true;
  btnFetchAvgPriceLabel.textContent = 'Getiriliyor…';

  // Gerçek bir ağ isteği yok (bkz. not); kısa bir gecikme sadece "işlem yapılıyor"
  // hissini vermek ve ani değer değişimini kullanıcıya fark ettirmek için.
  setTimeout(() => {
    if (inputCurrency.value === '₺') {
      inputFuelPrice.value = FUEL_TYPES[currentFuelType].avgPrice;
      updateFuelCalculation();
      toast(`${FUEL_TYPES[currentFuelType].label} için Türkiye ortalaması dolduruldu.`, 'success');
    } else {
      toast('Ortalama fiyat şu an yalnızca ₺ (TL) cinsinden mevcut. Lütfen para birimini ₺ yapın.', 'info');
    }
    btnFetchAvgPrice.disabled = false;
    btnFetchAvgPriceLabel.textContent = original;
  }, 450);
});

function updateFuelCalculation() {
  if (!state.totalDistanceKm) return;
  const consumption = parseFloat(inputConsumption.value) || 0;
  const price = parseFloat(inputFuelPrice.value) || 0;
  const currency = inputCurrency.value;

  // Tüketim her zaman L/100km (metrik) veya MPG (imperyal) olarak girilir; hesap metrik üzerinden yapılır
  let liters;
  if (state.unitSystem === 'imperial') {
    // consumption burada MPG (mil/galon) olarak yorumlanır
    const totalMiles = (state.totalDistanceKm * 1000) / 1609.344;
    const gallons = consumption > 0 ? totalMiles / consumption : 0;
    liters = gallons * 3.78541;
    fuelLitersEl.textContent = gallons.toFixed(1);
  } else {
    liters = (state.totalDistanceKm * consumption) / 100;
    fuelLitersEl.textContent = liters.toFixed(1);
  }

  const cost = liters * price;
  fuelCostEl.textContent = `${currency}${cost.toLocaleString('tr-TR', { maximumFractionDigits: 0 })}`;
}

/** Open-Elevation'a POST isteği atar; results dizisini döner */
async function requestOpenElevation(locations, signal) {
  const res = await fetchWithTimeout(ENDPOINTS.elevation, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ locations }),
    signal,
  }, 12000);
  if (!res.ok) throw new Error(`Open-Elevation hata kodu: ${res.status}`);
  const data = await res.json();
  return data.results.map((r) => ({ lat: r.latitude, lng: r.longitude, elevation: r.elevation }));
}

/** Fallback: OpenTopoData SRTM90m servisi (GET, virgülle ayrılmış lat,lng listesi) */
async function requestOpenTopoData(locations) {
  // OpenTopoData tek istekte ~100 noktayı destekler; zaten seyreltilmiş veri kullanıyoruz.
  const locStr = locations.map((l) => `${l.latitude},${l.longitude}`).join('|');
  const url = `${ELEVATION_FALLBACK}?locations=${encodeURIComponent(locStr)}`;
  const res = await fetchWithTimeout(url, {}, 15000);
  if (!res.ok) throw new Error(`OpenTopoData hata kodu: ${res.status}`);
  const data = await res.json();
  if (data.status !== 'OK') throw new Error('OpenTopoData beklenmeyen yanıt: ' + data.status);
  return data.results.map((r) => ({
    lat: r.location.lat, lng: r.location.lng, elevation: r.elevation ?? 0,
  }));
}

/** GPXZ /v1/elevation/point ile tek tek nokta sorgular (batch endpoint'i key olmadan test edilemediği
 * için en uyumlu/dokümante edilmiş yöntem budur). Nokta sayısı fazla olabileceğinden, aşırı istek
 * göndermemek adına GPXZ'nin toplu (batch) POST endpoint'ini tercih ediyoruz. */
async function requestGpxz(locations, apiKey) {
  const latlons = locations.map((l) => `${l.latitude},${l.longitude}`).join('|');
  const url = `https://api.gpxz.io/v1/elevation/batch`;
  const res = await fetchWithTimeout(url, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/x-www-form-urlencoded',
      'x-api-key': apiKey,
    },
    body: `latlons=${encodeURIComponent(latlons)}`,
  }, 15000);

  if (!res.ok) {
    if (res.status === 401 || res.status === 403) {
      throw new Error('Geçersiz GPXZ API anahtarı (401/403).');
    }
    if (res.status === 429) {
      throw new Error('GPXZ günlük istek kotası doldu (429).');
    }
    throw new Error(`GPXZ hata kodu: ${res.status}`);
  }
  const data = await res.json();
  if (!data.results) throw new Error('GPXZ beklenmeyen yanıt formatı.');
  return data.results.map((r) => ({ lat: r.lat, lng: r.lon, elevation: r.elevation }));
}
