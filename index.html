async function fetchElevationProfile(coordinates) {
  elevationLoadingEl.classList.remove('hidden');
  document.getElementById('elevation-chart').classList.add('opacity-0');
  const sourceNoteEl = document.getElementById('elevation-source-note');
  sourceNoteEl.classList.add('hidden');
  hideElevationKeyNotice();

  // Rota her ~N. noktadan biri alınarak seyreltilir (API yükünü azaltmak için)
  const step = Math.max(1, Math.floor(coordinates.length / 120));
  const sampled = coordinates.filter((_, i) => i % step === 0);
  if (sampled[sampled.length - 1] !== coordinates[coordinates.length - 1]) {
    sampled.push(coordinates[coordinates.length - 1]);
  }
  const locations = sampled.map(([lng, lat]) => ({ latitude: lat, longitude: lng }));

  let rawResults = null;
  let usedSource = 'open-elevation';

  // 1) Open-Elevation dene
  try {
    rawResults = await requestOpenElevation(locations);
  } catch (primaryErr) {
    console.warn('Open-Elevation başarısız, OpenTopoData deneniyor:', primaryErr.message);

    // 2) OpenTopoData dene
    try {
      rawResults = await requestOpenTopoData(locations);
      usedSource = 'opentopodata';
    } catch (fallbackErr) {
      console.warn('OpenTopoData da başarısız:', fallbackErr.message);

      // 3) Daha önce GPXZ key girildiyse onunla dene
      if (gpxzApiKey) {
        try {
          rawResults = await requestGpxz(locations, gpxzApiKey);
          usedSource = 'gpxz';
        } catch (gpxzErr) {
          console.error('GPXZ de başarısız:', gpxzErr.message);
          toast('GPXZ anahtarınızla da yükselti verisi alınamadı: ' + gpxzErr.message, 'error', 'Yükselti Hatası');
          elevGainEl.textContent = '—';
          elevLossEl.textContent = '—';
          elevMaxEl.textContent = '—';
          elevationLoadingEl.classList.add('hidden');
          document.getElementById('elevation-chart').classList.remove('opacity-0');
          renderElevationKeyNotice();
          return;
        }
      } else {
        // 4) Hiçbir anahtarsız servis çalışmadı ve key de girilmemiş
        toast('Anahtarsız yükselti servislerine ulaşılamadı. Devam etmek için opsiyonel bir GPXZ anahtarı girebilirsiniz.', 'error', 'Yükselti Hatası');
        elevGainEl.textContent = '—';
        elevLossEl.textContent = '—';
        elevMaxEl.textContent = '—';
        elevationLoadingEl.classList.add('hidden');
        document.getElementById('elevation-chart').classList.remove('opacity-0');
        renderElevationKeyNotice();
        return;
      }
    }
  }

  try {
    let cumulativeDist = 0;
    const points = rawResults.map((r, i) => {
      if (i > 0) {
        cumulativeDist += haversineMeters(rawResults[i - 1].lat, rawResults[i - 1].lng, r.lat, r.lng);
      }
      return { lat: r.lat, lng: r.lng, elevation: r.elevation, distanceAlongRoute: cumulativeDist };
    });

    state.elevationPoints = points;
    renderElevationChart(points);
    computeElevationMetrics(points);

    if (usedSource !== 'open-elevation') {
      const labels = { opentopodata: 'OpenTopoData (yedek)', gpxz: 'GPXZ (API anahtarınızla)' };
      sourceNoteEl.textContent = `ℹ Open-Elevation yanıt vermedi, ${labels[usedSource]} kullanıldı.`;
      sourceNoteEl.classList.remove('hidden');
    }
  } finally {
    elevationLoadingEl.classList.add('hidden');
    document.getElementById('elevation-chart').classList.remove('opacity-0');
  }
}

function computeElevationMetrics(points) {
  let gain = 0, loss = 0, max = -Infinity;
  for (let i = 1; i < points.length; i++) {
    const diff = points[i].elevation - points[i - 1].elevation;
    if (diff > 0) gain += diff; else loss += Math.abs(diff);
  }
  points.forEach((p) => { if (p.elevation > max) max = p.elevation; });

  elevGainEl.textContent = formatElevation(gain);
  elevLossEl.textContent = formatElevation(loss);
  elevMaxEl.textContent = formatElevation(max);
}

// Tesisler, rota hattının kendisine (Overpass'ın "around" operatörü ile) göre

// sayılabilecek ama gerçekçi bir kapsama alanı sağlıyor.
const ROUTE_POI_RADIUS_M = 300;

function clearPoiLayer(type) {

}

/**
 * Rota üzerindeki tesisleri ararken hız için tek bir bounding-box (bbox)
 * sorgusu kullanılır; "rota üzerinde mi" kontrolü (ROUTE_POI_RADIUS_M) sorgu
 * sonrası JS tarafında, her sonucun rota hattına olan gerçek mesafesiyle
 * yapılır.
 *
 * Neden bbox, "around" değil: Overpass'ın "around" filtresi tek bir merkez
 * noktası alır; rota boyunca onlarca ayrı "around" bloğu (her örneklenen
 * nokta için bir tane) yazmak sunucuda onlarca ayrı spatial-index taraması
 * anlamına gelir ve gözle görülür yavaşlığa yol açar — az sayıda nokta
 * ("1-2 tesis") bulup çok bekleten önceki davranışın sebebi buydu. Tek bir
 * bbox sorgusu ise sunucu için TEK bir indeks taraması olduğundan çok daha
 * hızlı yanıt verir; rotanın gerçek şekline uymayan (bbox köşelerindeki)
 * fazladan sonuçlar ise zaten client-side mesafe filtresiyle eleniyor.
 */
const MAX_AROUND_POINTS = 200; // client-side mesafe hesaplaması için örnekleme sıklığı

function sampleRouteCoordinates(coordinates) {
  const step = Math.max(1, Math.ceil(coordinates.length / MAX_AROUND_POINTS));
  const sampled = coordinates.filter((_, i) => i % step === 0);
  // coordinates [lng, lat] formatında geliyor.
  return sampled.map(([lng, lat]) => ({ lat, lon: lng }));
}

/** Rotanın tüm noktalarını kapsayan, radyüs kadar genişletilmiş bounding box döndürür. */
function computeRouteBoundingBox(points, radiusM) {
  let minLat = Infinity, maxLat = -Infinity, minLon = Infinity, maxLon = -Infinity;
  points.forEach(({ lat, lon }) => {
    if (lat < minLat) minLat = lat;
    if (lat > maxLat) maxLat = lat;
    if (lon < minLon) minLon = lon;
    if (lon > maxLon) maxLon = lon;
  });
  // Radyüsü kabaca derece cinsine çevirip bbox'a pay olarak ekle (enlem
  // farkını göz ardı eden basit bir yaklaşım; POI aramasında yeterli hassasiyette).
  const padDeg = (radiusM / 111000) * 1.5; // %50 güvenlik payı
  return {
    south: (minLat - padDeg).toFixed(6),
    west: (minLon - padDeg).toFixed(6),
    north: (maxLat + padDeg).toFixed(6),
    east: (maxLon + padDeg).toFixed(6),
  };
}

function buildOverpassAroundQuery(coordinates, tagFilter, radiusM) {
  const points = sampleRouteCoordinates(coordinates);
  const bbox = computeRouteBoundingBox(points, radiusM);

  // Sunucu tarafı zaman aşımı (20s), bizim client zaman aşımımızdan (30s,
  // aşağıda fetchWithTimeout çağrısında) kısa tutuluyor; böylece Overpass
  // kendi süresini doldurunca düzgün bir hata gövdesiyle yanıt verme fırsatı
  // buluyor, bizim tarafımızda sessizce "isteğin ortasında" kesilmiyor.
  // "nwr" (node+way+relation birleşimi), hem nokta hem alan (way/relation)
  // olarak haritalanmış tesisleri (büyük oteller, AVM içi restoranlar vb.)
  // tek satırda kapsar.
  return `[out:json][timeout:20];
    nwr[${tagFilter}](${bbox.south},${bbox.west},${bbox.north},${bbox.east});
  out center 500;`;
}

/**
 * İki nokta arası mesafeyi (metre) haversine formülüyle hesaplar. POI
 * sonuçlarının gerçekten "rota üzerinde" mi yoksa sadece bbox içinde ama
 * rotadan uzakta mı olduğunu ayırt etmek için kullanılır.
 */
function haversineDistanceM(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const toRad = (d) => (d * Math.PI) / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

/** Verilen noktanın, örneklenmiş rota noktalarından en az birine olan en kısa mesafesini (metre) döndürür. */
function distanceToRouteM(lat, lon, routePoints) {
  let min = Infinity;
  for (const p of routePoints) {
    const d = haversineDistanceM(lat, lon, p.lat, p.lon);
    if (d < min) min = d;
    if (min <= 1) break; // pratik olarak sıfır, daha fazla aramaya gerek yok
  }
  return min;
}



/**
 * Tek bir Overpass isteğini önce GET, o başarısız olursa aynı sunucuda POST
 * ile dener.
 *
 * GET tercih edilir çünkü overpass-api.de, tarayıcıdan gelen POST isteklerinin
 * tetiklediği CORS preflight'ını (OPTIONS) HTTP 406 ile reddediyor — istek
 * gövdesi sunucuya hiç ulaşmadan düşüyordu, bu da POI aramasının hep
 * "0 tesis" ile sonuçlanmasının asıl sebebiydi. GET istekleri "basit" CORS
 * istekleridir ve preflight gerektirmez. Yine de bazı aynalar (mirror) POST'u
 * tercih edebileceğinden veya GET için URL uzunluk sınırına takılabileceğinden,
 * GET başarısız olursa aynı uç noktada POST da bir kez deneniyor.
 */
// Bbox tabanlı sorgu tek bir spatial-index taraması gerektirdiğinden çok daha
// hafiftir; bu yüzden timeout önceki (30sn) değerden kısaltıldı — bir mirror
// gerçekten yanıt vermiyorsa kullanıcıyı daha az bekletip bir sonraki mirror'a
// hızlıca geçiliyor.
const OVERPASS_TIMEOUT_MS = 15000;

async function fetchFromOverpassEndpoint(endpoint, query) {
  try {
    const url = `${endpoint}?data=${encodeURIComponent(query)}`;
    const res = await fetchWithTimeout(url, {
      method: 'GET',
      headers: { 'Accept': 'application/json, text/plain, */*' },
    }, OVERPASS_TIMEOUT_MS);
    if (res.ok) return res;
    // 405 (Method Not Allowed) veya 414 (URI Too Long) gibi durumlarda
    // POST'u dene; diğer durumlarda da zarar vermez, aynı sonuca varır.
    return await fetchWithTimeout(endpoint, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/x-www-form-urlencoded',
        'Accept': 'application/json, text/plain, */*',
      },
      body: 'data=' + encodeURIComponent(query),
    }, OVERPASS_TIMEOUT_MS);
  } catch (getErr) {
    // GET ağ/CORS hatasıyla tamamen başarısız oldu; aynı uç noktada POST'u dene.
    return fetchWithTimeout(endpoint, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/x-www-form-urlencoded',
        'Accept': 'application/json, text/plain, */*',
      },
      body: 'data=' + encodeURIComponent(query),
    }, OVERPASS_TIMEOUT_MS);
  }
}

/**
 * Overpass sorgusunu birincil sunucuya, o başarısız olursa sırayla topluluk
 * aynalarına gönderir (bkz. fetchFromOverpassEndpoint için GET/POST tercihi).
 */
async function fetchFromOverpassWithMirrors(query, label) {
  let lastError = null;

  for (const endpoint of ENDPOINTS.overpassMirrors) {
    try {
      const res = await fetchFromOverpassEndpoint(endpoint, query);

      if (!res.ok) {
        // Overpass, sorgu hatalarında (400) veya aşırı yüklenmede (429/504)
        // genelde body'de okunabilir bir açıklama döndürür; sadece status
        // kodunu göstermek yerine bu detayı da yakalayıp konsola basıyoruz
        // ki gerçek sebep ("rate limited", "syntax error", "406" vb.) görülebilsin.
        let detail = '';
        try { detail = (await res.text()).slice(0, 300); } catch (_) { /* body okunamadı, sessiz geç */ }
        console.error(`Overpass hata gövdesi (${label}, ${endpoint}, HTTP ${res.status}):`, detail);

        // 406/429/5xx gibi durumlarda bir sonraki aynaya geçmeyi dene;
        // 400 (sözdizimi hatası) gibi durumlarda aynayı değiştirmenin
        // faydası olmaz ama yine de devam edip son hatayı raporluyoruz.
        lastError = new Error(
          res.status === 429 || res.status === 504
            ? `${label} araması başarısız: Overpass sunucusu şu an yoğun, birkaç saniye sonra tekrar deneyin.`
            : res.status === 406
            ? `${label} araması başarısız: Overpass sunucusu isteği reddetti (406).`
            : `${label} araması başarısız: HTTP ${res.status}`
        );
        continue;
      }

      return await res.json();
    } catch (err) {
      // Ağ/CORS/timeout hatası: bir sonraki aynayı dene.
      console.error(`Overpass isteği başarısız (${label}, ${endpoint}):`, err);
      lastError = err;
    }
  }

  throw lastError || new Error(`${label} araması başarısız: Hiçbir Overpass sunucusuna ulaşılamadı.`);
}

async function searchPOIsAlongRoute() {
  if (!state.routeGeoJSON) {
    toast('Önce bir rota hesaplayın.', 'info');
    return;
  }
  if (state.activePoiTypes.size === 0) {
    toast('Lütfen en az bir tesis türü seçin (Benzinlik / Otel / Restoran).', 'info');
    return;
  }

  const btn = document.getElementById('btn-poi-search');
  const originalHtml = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Aranıyor…`;
  poiResultHint.classList.add('hidden');

  const coords = state.routeGeoJSON.coordinates;
  const routePoints = sampleRouteCoordinates(coords);
  const activeTypes = Array.from(state.activePoiTypes);

  let totalFound = 0;
  const errors = [];

  try {
    // Seçilen tüm POI türleri (Benzinlik/Otel/Restoran) TEK TEK sırayla değil,
    // AYNI ANDA (paralel) sorgulanıyor. Önceki sürüm her türü sırayla, aralarına
    // 600ms bekleme koyarak işliyordu; 3 tür seçiliyse bu, toplam süreyi 3 kata
    // katlıyordu. Overpass sunucuları eşzamanlı birkaç isteği rahatlıkla
    // kaldırabildiği için, buradaki tek sıralı kısıtlama zaten "her sunucuya
    // art arda çok hızlı istek atmamak" amaçlıydı — paralel çalıştırmak bu
    // amacı bozmuyor çünkü toplam istek sayısı aynı, sadece eşzamanlı.
    const results = await Promise.allSettled(
      activeTypes.map(async (type) => {
        clearPoiLayer(type);
        const query = buildOverpassAroundQuery(coords, POI_TAG_MAP[type], ROUTE_POI_RADIUS_M);
        const data = await fetchFromOverpassWithMirrors(query, POI_LABELS[type]);
        return { type, data };
      })
    );

    results.forEach((result, i) => {
      const type = activeTypes[i];
      if (result.status === 'rejected') {
        console.error(`Overpass POI arama hatası (${POI_LABELS[type]}):`, result.reason);
        errors.push({ type, err: result.reason });
        return;
      }

      const { data } = result.value;
      const seen = new Set();

      (data.elements || []).forEach((el) => {
        // Overpass'ta node/way/relation ID uzayları birbirinden bağımsızdır;
        // aynı sayısal id farklı tiplerde farklı gerçek nesneleri belirtebilir.
        // Bu yüzden benzersizlik anahtarına tipi de dahil ediyoruz.
        const uniqueKey = `${el.type}/${el.id}`;
        if (seen.has(uniqueKey)) return;
        seen.add(uniqueKey);

        // node elemanları doğrudan lat/lon taşır; way/relation elemanları
        // (out center sayesinde) center.lat/center.lon taşır.
        const lat = el.lat ?? el.center?.lat;
        const lon = el.lon ?? el.center?.lon;
        if (lat == null || lon == null) return; // koordinatsız/eksik sonucu atla

        // Sorgu, hızlı olması için rotayı çevreleyen bir bbox kullandığından,
        // bbox'ın köşelerinde kalıp rotadan aslında uzak olan sonuçları burada,
        // rota hattına olan gerçek mesafeye göre eliyoruz.
        if (distanceToRouteM(lat, lon, routePoints) > ROUTE_POI_RADIUS_M) return;

        const name = el.tags?.name || POI_LABELS[type];
        const marker = L.marker([lat, lon], { icon: makePinIcon(type) });
        marker.bindPopup(`
          <b>${escapeHtml(name)}</b><br>
          <span style="color:#94a3b8">${POI_LABELS[type]}</span>
          ${el.tags?.['addr:street'] ? `<br><span style="color:#64748b;font-size:11px">${escapeHtml(el.tags['addr:street'])}</span>` : ''}
        `);
        marker.addTo(poiLayerGroup);
        state.poiMarkers[type].push(marker);
        totalFound++;
      });
    });

    poiResultHint.textContent = `${totalFound} tesis bulundu (yol üzerinde).`;
    poiResultHint.classList.remove('hidden');

    if (errors.length === 0) {
      toast(`${totalFound} tesis haritaya eklendi.`, 'success', 'POI Arama Tamamlandı');
    } else {
      // Bazı türler başarılı bazıları başarısız olabilir; kısmi sonucu göster
      // ama hangi türlerin başarısız olduğunu da belirt.
      const failedLabels = errors.map((e) => POI_LABELS[e.type]).join(', ');
      toast(`${totalFound} tesis bulundu. Bazı türler başarısız oldu: ${failedLabels}.`, 'error', 'Kısmi Sonuç');
    }
  } catch (err) {
    console.error('Overpass POI arama hatası:', err);
    // Ağ/CORS/timeout hatalarında err.message genelde "Failed to fetch" gibi
    // teknik ve anlaşılmaz bir metin olur; kullanıcıya olası sebebi ve ne
    // yapabileceğini gösteren daha açıklayıcı bir mesaj sunuyoruz.
    const isAbort = err.name === 'AbortError';
    const isNetwork = err instanceof TypeError; // fetch, ağ/CORS hatalarında TypeError fırlatır
    const friendlyMessage = isAbort
      ? 'İstek zaman aşımına uğradı. Overpass sunucusu yavaş yanıt veriyor olabilir, tekrar deneyin.'
      : isNetwork
      ? 'Overpass sunucusuna ulaşılamadı. İnternet bağlantınızı kontrol edin ya da birkaç saniye sonra tekrar deneyin.'
      : err.message;
    toast(friendlyMessage, 'error', 'POI Hatası');
  } finally {
    btn.disabled = false;
    btn.innerHTML = originalHtml;
  }
}

/* ============================================================
   13. GPX DIŞA AKTARMA
   ============================================================ */
document.getElementById('btn-export-gpx').addEventListener('click', () => {
  if (!state.routeGeoJSON) {
    toast('İndirmek için önce bir rota hesaplayın.', 'info');
    return;
  }
  try {
    const gpx = buildGPX(state.routeGeoJSON, state.stops);
    const blob = new Blob([gpx], { type: 'application/gpx+xml' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `rotalis-rota-${Date.now()}.gpx`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast('GPX dosyası indirildi.', 'success');
  } catch (err) {
    console.error('GPX oluşturma hatası:', err);
    toast('GPX dosyası oluşturulamadı: ' + err.message, 'error');
  }
});

function buildGPX(geometry, stops) {
  const now = new Date().toISOString();
  const trkpts = geometry.coordinates
    .map(([lng, lat]) => `      <trkpt lat="${lat}" lon="${lng}"></trkpt>`)
    .join('\n');

  const wpts = stops
    .map((s, i) => `  <wpt lat="${s.lat}" lon="${s.lng}"><name>${escapeXml(s.name)}</name></wpt>`)
    .join('\n');

  return `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="Rotasyon" xmlns="http://www.topografix.com/GPX/1/1">
  <metadata><time>${now}</time></metadata>
${wpts}
  <trk>
    <name>Rotasyon Rotası</name>
    <trkseg>
${trkpts}
    </trkseg>
  </trk>
</gpx>`;
}

function escapeXml(str = '') {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

/* ============================================================
   14. PAYLAŞIM & URL STATE
   ============================================================ */
document.getElementById('btn-share').addEventListener('click', async () => {
  if (state.stops.length < 2) {
    toast('Paylaşmak için en az 2 durak eklemelisiniz.', 'info');
    return;
  }
  try {
    const params = new URLSearchParams();
    const stopsParam = state.stops
      .map((s) => `${s.lat.toFixed(6)},${s.lng.toFixed(6)},${encodeURIComponent(s.name)}`)
      .join(';');
    params.set('stops', stopsParam);

    const shareUrl = `${window.location.origin}${window.location.pathname}?${params.toString()}`;
    await navigator.clipboard.writeText(shareUrl);
    toast('Rota bağlantısı panoya kopyalandı!', 'success', 'Paylaşıma Hazır');
  } catch (err) {
    console.error('Paylaşım hatası:', err);
    toast('Bağlantı panoya kopyalanamadı: ' + err.message, 'error');
  }
});

/** @returns {boolean} URL'den bir rota yüklenip yüklenmediği */
function loadRouteFromURL() {
  const params = new URLSearchParams(window.location.search);
  const stopsParam = params.get('stops');
  if (!stopsParam) return false;

  try {
    const parsedStops = stopsParam.split(';').map((chunk) => {
      const [lat, lng, name] = chunk.split(',');
      return { id: uid(), lat: parseFloat(lat), lng: parseFloat(lng), name: decodeURIComponent(name || 'Durak') };
    }).filter((s) => !isNaN(s.lat) && !isNaN(s.lng));

    if (parsedStops.length >= 2) {
      state.stops = parsedStops;
      renderStops();
      renderStopMarkers();
      calculateRoute();
      toast('Paylaşılan rota yüklendi.', 'success', 'Rota Yüklendi');
      return true;
    }
  } catch (err) {
    console.error('URL rota ayrıştırma hatası:', err);
  }
  return false;
}

/* ============================================================
   14b. BİRİM SİSTEMİ TOGGLE (Metrik / İngiliz)
   ============================================================ */
const btnUnitToggle = document.getElementById('btn-unit-toggle');
const unitToggleLabel = document.getElementById('unit-toggle-label');

btnUnitToggle.addEventListener('click', () => {
  state.unitSystem = state.unitSystem === 'metric' ? 'imperial' : 'metric';
  unitToggleLabel.textContent = state.unitSystem === 'imperial' ? 'mil' : 'km';
  updateFuelFormLabels();

  // Varsayılan tüketim değerini birim değişince makul bir değere çevir (L/100km ⇄ MPG)
  if (state.unitSystem === 'imperial' && parseFloat(inputConsumption.value) > 40) {
    inputConsumption.value = '31'; // ~7.5L/100km karşılığı kabaca
  } else if (state.unitSystem === 'metric' && parseFloat(inputConsumption.value) < 40) {
    inputConsumption.value = '7.5';
  }

  // Aktif rota varsa tüm birim-bağımlı gösterimleri yeniden çiz
  if (state.routeGeoJSON) {
    renderRouteSummary();
    updateFuelCalculation();
    if (state.elevationPoints.length) {
      renderElevationChart(state.elevationPoints);
      computeElevationMetrics(state.elevationPoints);
    }
    renderRouteAlternatives();
  }
  saveSessionToStorage();
});

/* ============================================================
   14c. OTURUM KALICILIĞI (localStorage)
   Not: Bu, bir web sayfası projesidir (Claude.ai artifact değildir),
   bu yüzden localStorage kullanımı burada güvenli ve uygundur.
   ============================================================ */
function saveSessionToStorage() {
  try {
    const payload = {
      stops: state.stops,
      unitSystem: state.unitSystem,
      fuelType: currentFuelType,
      fuelConsumption: inputConsumption.value,
      fuelPrice: inputFuelPrice.value,
      fuelCurrency: inputCurrency.value,
      savedAt: Date.now(),
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
  } catch (err) {
    console.warn('Oturum localStorage\'a kaydedilemedi:', err);
  }
}

function loadSessionFromStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const payload = JSON.parse(raw);
    if (!payload?.stops?.length) return false;

    state.stops = payload.stops;
    state.unitSystem = payload.unitSystem || 'metric';

    unitToggleLabel.textContent = state.unitSystem === 'imperial' ? 'mil' : 'km';
    updateFuelFormLabels();
    if (payload.fuelType && FUEL_TYPES[payload.fuelType]) {
      currentFuelType = payload.fuelType;
      document.querySelectorAll('.fuel-type-btn').forEach((b) => {
        b.classList.toggle('active', b.dataset.fuelType === currentFuelType);
      });
    }
    if (payload.fuelConsumption) inputConsumption.value = payload.fuelConsumption;
    if (payload.fuelPrice) inputFuelPrice.value = payload.fuelPrice;
    if (payload.fuelCurrency) inputCurrency.value = payload.fuelCurrency;

    renderStops();
    renderStopMarkers();
    if (state.stops.length >= 2) calculateRoute();
    return true;
  } catch (err) {
    console.warn('Kayıtlı oturum okunamadı:', err);
    return false;
  }
}

/* ============================================================
   15. MOBİL DRAWER KONTROLÜ
   ============================================================ */
const panelEl = document.getElementById('panel');
const drawerHandle = document.getElementById('drawer-handle');

function isMobileViewport() {
  return window.innerWidth < 1024;
}

function openDrawer() {
  panelEl.classList.add('open');
  drawerHandle.classList.add('hidden-handle');
  document.body.classList.add('drawer-open');
}
function closeDrawer() {
  panelEl.classList.remove('open');
  drawerHandle.classList.remove('hidden-handle');
  document.body.classList.remove('drawer-open');
}

drawerHandle.addEventListener('click', openDrawer);
document.getElementById('drawer-close').addEventListener('click', closeDrawer);

/* ---- Panel'i parmakla aşağı kaydırarak kapatma (swipe-to-dismiss) ----
   Panel başlığından (header) başlayan bir dokunma, parmak hareketiyle
   birebir takip edilerek panel aşağı kaydırılır; belirli bir eşiğin
   (yükseklik veya hız) üzerinde bırakılırsa panel tamamen kapanır,
   altındaysa yumuşak bir geçişle eski konumuna geri döner. Böylece
   kullanıcı haritayı görmek istediğinde paneli doğal bir jestle indirebilir. */
const panelDragHandle = document.getElementById('panel-drag-handle');
let dragStartY = 0;
let dragCurrentY = 0;
let isDraggingPanel = false;
let panelHeightAtDragStart = 0;

function onPanelDragStart(e) {
  if (!isMobileViewport() || !panelEl.classList.contains('open')) return;
  if (e.target.closest('#drawer-close')) return; // kapatma butonuna dokunuşu sürükleme sanma
  const touch = e.touches ? e.touches[0] : e;
  dragStartY = touch.clientY;
  dragCurrentY = dragStartY;
  isDraggingPanel = true;
  panelHeightAtDragStart = panelEl.getBoundingClientRect().height;
  panelEl.style.transition = 'none'; // sürükleme sırasında CSS transition'ı devre dışı bırak, birebir takip etsin
}

function onPanelDragMove(e) {
  if (!isDraggingPanel) return;
  const touch = e.touches ? e.touches[0] : e;
  dragCurrentY = touch.clientY;
  const deltaY = Math.max(0, dragCurrentY - dragStartY); // sadece aşağı yönü uygula
  panelEl.style.transform = `translateY(${deltaY}px)`;
}

function onPanelDragEnd() {
  if (!isDraggingPanel) return;
  isDraggingPanel = false;
  panelEl.style.transition = ''; // CSS'teki geçiş animasyonunu geri aç
  panelEl.style.transform = '';

  const deltaY = Math.max(0, dragCurrentY - dragStartY);
  // Panelin en az ~%28'i kadar aşağı çekildiyse tamamen kapat, aksi halde geri getir.
  const closeThreshold = panelHeightAtDragStart * 0.28;
  if (deltaY > closeThreshold) {
    closeDrawer();
  }
}

panelDragHandle.addEventListener('touchstart', onPanelDragStart, { passive: true });
panelDragHandle.addEventListener('touchmove', onPanelDragMove, { passive: true });
panelDragHandle.addEventListener('touchend', onPanelDragEnd);
panelDragHandle.addEventListener('touchcancel', onPanelDragEnd);

/* ============================================================
   16. UYGULAMA BAŞLATMA
   ============================================================ */
function init() {
  initMap();
  if (isMobileViewport()) {
    openDrawer();
  }

  // Daha önce girilmiş bir LocationIQ / GPXZ anahtarı varsa geri yükle (yedekleme zincirleri için)
  try {
    const savedLocationIqKey = localStorage.getItem('rotalis_locationiq_key');
    if (savedLocationIqKey) locationIqApiKey = savedLocationIqKey;
    const savedGpxzKey = localStorage.getItem('rotalis_gpxz_key');
    if (savedGpxzKey) gpxzApiKey = savedGpxzKey;
  } catch (e) { /* localStorage erişilemezse sessizce geç */ }

  // Öncelik: URL'de paylaşılan bir rota varsa onu yükle; yoksa son oturumu localStorage'dan geri getir.
  const loadedFromUrl = loadRouteFromURL();
  if (!loadedFromUrl) {
    loadSessionFromStorage();
  }

  // Durak/rota değişse de değişmese de kullanıcı yakıt/POI ayarlarını değiştirdiğinde oturumu güncel tut
  [inputConsumption, inputFuelPrice, inputCurrency].forEach((el) => {
    el.addEventListener('change', saveSessionToStorage);
  });
}

document.addEventListener('DOMContentLoaded', init);
